.login{max-width:420px;margin:10vh auto 0}
.login h1{font:400 56px/1 var(--display);color:#eafff1;letter-spacing:.02em;text-shadow:0 0 12px rgba(0,255,102,.5)}

.prompt{display:flex;align-items:center;gap:8px;background:#000;border:1px solid var(--accent);padding:0 12px;margin-top:6px}

.sug.off{opacity:.5}
.flag{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:10px 12px;font-weight:600}
.ringrow{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.ring{position:relative;width:112px;min-height:112px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.ring .rn{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:.72rem;line-height:1.2;padding:0 14px}
.ring .rn strong{font-family:var(--display);font-size:1.7rem;font-weight:400;line-height:1}
.bars{flex:1 1 180px;min-width:0}
.bar{margin-bottom:10px}.bar .bt{display:flex;justify-content:space-between;font-size:.82rem;margin-bottom:3px}
.bk{height:8px;border-radius:99px;background:var(--line);overflow:hidden}.bf{height:100%;background:var(--link);border-radius:99px}

.scale{display:flex;gap:6px;flex-wrap:wrap}

.seg{display:flex;gap:6px;flex-wrap:wrap}
.q{font-family:var(--display);font-size:1.5rem;line-height:1.25;margin:6px 0 12px}
.ans{background:var(--good-bg);border-radius:8px;padding:10px 12px;margin:10px 0}
.good{background:var(--good-bg);border-radius:8px;padding:10px 12px}
.sub{font-size:.8rem;color:var(--muted)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.mtile span{font-size:.85rem;opacity:.9}

.msg{border-radius:12px;padding:12px 14px;max-width:92%;min-width:0}

.msg.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line)}
.made{text-align:center;color:var(--muted);font-size:.8rem;margin:24px 0 0}
.reveal{position:relative;display:inline-block;margin-bottom:6px}
.reveal .logo{height:72px}
.reveal .wash{position:absolute;left:0;right:0;bottom:-8px;height:5px;border-radius:3px;background:linear-gradient(90deg,#8A9E7C,#2C5F5F,#C9A227,#6B4F8A,#C17817);clip-path:inset(0 100% 0 0);animation:sweep 2.2s ease-out .3s forwards}
@keyframes sweep{to{clip-path:inset(0 0 0 0)}}
@media (prefers-reduced-motion: reduce){.reveal .wash{animation:none;clip-path:inset(0 0 0 0)}}
.spin{position:relative;width:132px;height:132px;margin:6px auto 10px}.spin svg{position:absolute;inset:0;width:100%;height:100%}.spin .tk{transform-origin:60px 60px;animation:gpspin 3s linear infinite}.spin .mk{position:absolute;left:50%;top:50%;height:58px;width:auto;transform:translate(-50%,-50%);filter:drop-shadow(0 0 6px rgba(34,211,238,.6));animation:gppulse 1.8s ease-in-out infinite}@keyframes gpspin{to{transform:rotate(360deg)}}@keyframes gppulse{50%{opacity:.7}}@media (prefers-reduced-motion: reduce){.spin .tk,.spin .mk{animation:none}}
:focus-visible{outline:3px solid var(--link);outline-offset:2px}

/* ===== HUD skin: sci fi, game feel. Dark only. Cipher logo kept. ===== */
body{background-color:var(--bg);
  background-image:radial-gradient(900px 420px at 80% -120px,rgba(34,211,238,.10),transparent 70%),
    linear-gradient(rgba(103,232,249,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(103,232,249,.035) 1px,transparent 1px);
  background-size:auto,44px 44px,44px 44px;background-attachment:fixed}
h1,h2,.q,.dn,.hero .lbl{font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
h1{font-size:1.7rem;line-height:1.05;text-shadow:0 0 18px var(--glow)}
h2{font-size:1.15rem;color:var(--ink);padding-left:10px;border-left:3px solid var(--accent)}
.q{font-size:1.15rem;line-height:1.35;text-transform:none;letter-spacing:.01em}
.dn{font-size:1.05rem}
h3{font-family:var(--display);letter-spacing:.03em}
.hero .num,.stats .n,.ring .rn strong,.sub b{font-family:var(--mono);font-weight:400}
.ring .rn strong{font-size:1.6rem;color:var(--ink);text-shadow:0 0 12px var(--glow)}
nav{background:rgba(6,10,18,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.tab{font-family:var(--display);font-size:.78rem;text-transform:uppercase;letter-spacing:.09em;border-radius:0;border-bottom:2px solid transparent;padding:8px 12px}
.tab.on{background:linear-gradient(180deg,transparent,rgba(34,211,238,.16));color:var(--link);border-bottom-color:var(--accent);box-shadow:0 8px 18px -10px var(--glow)}
.card,.day,.sug{border-radius:2px;border-color:var(--line);
  background:linear-gradient(135deg,rgba(34,211,238,.07),transparent 38%),var(--surface);
  clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px));
  box-shadow:inset 0 1px 0 rgba(103,232,249,.10)}
.card{position:relative}
.card.alert{background:var(--warn-bg)}
.day.today{border:1px solid var(--accent);box-shadow:inset 0 0 0 1px var(--accent),0 0 22px -8px var(--glow)}
.hero{border-radius:2px;background:linear-gradient(100deg,var(--accent),#7DD3FC 70%,#A5B4FC);box-shadow:0 0 28px -8px var(--glow);
  clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,0 100%)}
.hero .num{font-size:3.2rem}
.btn{font-family:var(--display);text-transform:uppercase;letter-spacing:.07em;font-weight:700;font-size:.85rem;border-radius:2px;
  box-shadow:0 0 16px -4px var(--glow);clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px))}
.btn.ghost{color:var(--link);background:rgba(34,211,238,.06);box-shadow:none}
.btn.quiet{box-shadow:none;color:var(--muted)}
.btn.small{font-size:.74rem;padding:5px 10px}
.btn:hover:not(:disabled){filter:brightness(1.12)}
input,select,textarea{border-radius:2px;background:#050911;border-color:#4F78B0}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 1px var(--accent),0 0 14px -4px var(--glow)}
.chip,.dot{border-radius:2px;font-family:var(--mono);font-weight:400;font-size:.76rem;letter-spacing:.04em;text-transform:uppercase}
.chip{background:rgba(34,211,238,.10);color:var(--link);border:1px solid rgba(34,211,238,.28)}
.chip.fam{background:var(--protect);color:var(--protect-ink)}
.chip.warn{background:var(--warn-bg);color:var(--warn);border-color:rgba(255,184,77,.4)}
.dot.on{box-shadow:0 0 12px -2px var(--glow)}
.links a{border-radius:2px;font-family:var(--mono);font-weight:400;background:#050911}
.mode,.scale label,.mtile,.thumbs img,.ans,.good,.flag,.msg{border-radius:2px}
.mode.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.msg.u{background:linear-gradient(100deg,var(--accent),#7DD3FC)}
.msg.a{border-color:var(--line);background:var(--surface2)}
.ans,.good{border-left:3px solid var(--good)}
.it{border-top:1px solid rgba(34,55,90,.7)}
#toast{background:var(--surface2);color:var(--ink);border:1px solid var(--accent);border-radius:2px;box-shadow:0 0 22px -6px var(--glow);font-family:var(--display);letter-spacing:.03em}
/* ring: tick bezel, glow, flat ends */
.ring svg{filter:drop-shadow(0 0 6px var(--glow))}
.ring svg circle{stroke-linecap:butt}
.ring::before{content:"";position:absolute;inset:-5px;border-radius:50%;pointer-events:none;
  background:repeating-conic-gradient(rgba(103,232,249,.35) 0 1.4deg,transparent 1.4deg 7.5deg);
  -webkit-mask:radial-gradient(circle,transparent 62%,#000 63%,#000 100%);mask:radial-gradient(circle,transparent 62%,#000 63%,#000 100%)}
.ring{margin:6px}
/* segmented bars */
.bk{height:10px;border-radius:0;background:repeating-linear-gradient(90deg,#14223C 0 9px,transparent 9px 12px)}
.bf{border-radius:0;background:repeating-linear-gradient(90deg,var(--link) 0 9px,transparent 9px 12px);box-shadow:0 0 12px -2px var(--glow)}
.bar>span{background:var(--accent);box-shadow:0 0 12px -2px var(--glow)}
.bt span:last-child{font-family:var(--mono);color:var(--link);white-space:nowrap;font-size:.74rem;letter-spacing:.02em;text-transform:uppercase}
.bars .bt span:first-child{white-space:nowrap}
.login{border:1px solid var(--line);padding:20px 18px;background:#000;border-color:var(--accent);clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px))}
.made{font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase}
/* fixes: progress bars wrapper was inheriting the old 10px bar track */
.bars .bar{height:auto;background:none;border-radius:0;overflow:visible}
.bars .bt{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;font-family:var(--display);color:var(--muted)}
.ring:has(.rn[style*="static"])::before{display:none}
.ring .rn[style*="static"] strong{font-family:var(--display);font-size:1rem;text-transform:uppercase;letter-spacing:.05em;text-shadow:none}
.mtile{background:linear-gradient(135deg,color-mix(in srgb,var(--tint) 45%,#060A12),#09111f 85%);border:1px solid var(--line);border-left:4px solid color-mix(in srgb,var(--tint) 55%,#9FE8FF)}
.mtile strong{font-family:var(--display);text-transform:uppercase;letter-spacing:.04em;font-size:1.05rem;font-weight:600}
.mtile:hover,.mtile:focus-visible{box-shadow:0 0 0 1px var(--accent),0 0 18px -6px var(--glow)}
/* soft scan sweep on the hero, off for reduced motion */
@media (prefers-reduced-motion:no-preference){
  .hero{position:relative;overflow:hidden}
  .hero::after{content:"";position:absolute;top:0;bottom:0;width:60px;left:-80px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent);animation:scan 5s ease-in-out infinite}
  @keyframes scan{0%,60%{left:-80px}100%{left:110%}}
}

/* ===== v2 layout: bottom navigation, bigger tap targets, calmer Today ===== */
body{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
nav.sub{top:0;padding:6px 0;gap:6px;overflow-x:auto;scrollbar-width:none}
nav.sub::-webkit-scrollbar{display:none}

function vWeek(){
  var ws=addDays(monday(ST.today),weekOff*7);wkLoad(ws);

  for(var i=0;i<7;i++){
    var d=addDays(ws,i);
    var its=ST.items.filter(function(x){return x.date===d&&x.status!=='dropped';}).sort(function(a,b){return a.time<b.time?-1:1;});
    var tests=ST.dates.filter(function(x){return x.date===d;});
    var st=dayStatus(d),dm=dayModelFor(d,ws),fr=dm?dm.frames:[],bl=dm?dm.blocks:[];
    h+='<section class="day'+(d===ST.today?' today':'')+'" data-date="'+d+'"><div class="row" style="justify-content:space-between"><span class="dn">'+DAYN[i]+' '+pd(d).getDate()+'</span><button class="btn small quiet" data-act="addfor" data-d="'+d+'" aria-label="Add on this day">+</button></div>';
    if(st)h+='<p><span class="chip opt">After school: '+esc(modeName(st.mode))+'</span></p>';
    h+=tests.map(function(x){return '<p><span class="chip warn">'+esc(examName(x.label))+'</span></p>';}).join('');
    h+=fr.map(function(f){return '<p class="sub wkframe"><span class="chip'+(f.kind==='locked'?' fam':'')+'">'+(f.kind==='locked'?'LOCKED':'SCHOOL')+'</span> <strong>'+esc(f.from)+' to '+esc(f.to)+'</strong> '+esc(f.label)+'</p>';}).join('');
    h+=bl.map(function(b){return '<p class="sub wkblock"><strong>'+esc(b.start)+' to '+esc(b.end)+'</strong> '+esc(b.label)+' <span class="chip'+(b.state==='suggested'?' opt':'')+'">'+(b.state==='suggested'?'Suggested':'Locked in')+'</span></p>';}).join('');

/* ---------- v2 views ---------- */
function pct(a,b){return b?Math.round(a/b*100):0;}
function avg(a){return a.length?a.reduce(function(x,y){return x+y;},0)/a.length:0;}
function weekStart7(){return addDays(ST.today,-6);}
function touchedSubjects(){
  var from=weekStart7(),set={};
  ST.items.forEach(function(i){if(i.status==='done'&&i.subject&&i.date>=from&&i.date<=ST.today)set[i.subject]=1;});
  ST.practice.forEach(function(p){if(p.date>=from)set[p.subject]=1;});
  ST.visits.forEach(function(v){if(v.date>=from)set[v.subject]=1;});
  return set;
}
function progressCard(){
  var ws=monday(ST.today),we=addDays(ws,6);
  var wk=ST.items.filter(function(i){return TASK[i.type]&&i.date>=ws&&i.date<=we&&i.status!=='dropped';});
  var dn=wk.filter(function(i){return i.status==='done';}).length;
  var set=touchedSubjects(),n=SUBJ.filter(function(x){return set[x];}).length;
  var qz=ST.practice.filter(function(p){return p.date>=weekStart7();}).length;
  var pct=wk.length?Math.round(dn*100/wk.length):0,C=2*Math.PI*42,off=C-(C*pct/100);
  function lab(v,max){return v>=max?'done':v>0?'getting there':'not yet';}
  function bar(name,v,max){var w=Math.min(100,Math.round(v*100/Math.max(1,max)));return '<div class="bar"><div class="bt"><span>'+name+'</span><span class="muted">'+lab(v,max)+'</span></div><div class="bk" role="img" aria-label="'+name+': '+lab(v,max)+'"><div class="bf" style="width:'+w+'%"></div></div></div>';}
  var ring=wk.length?'<div class="ring"><svg viewBox="0 0 100 100" width="112" height="112" aria-hidden="true"><circle cx="50" cy="50" r="42" fill="none" stroke="var(--line)" stroke-width="9"/><circle cx="50" cy="50" r="42" fill="none" stroke="var(--link)" stroke-width="9" stroke-linecap="round" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 50 50)"/></svg><div class="rn"><strong>'+pct+'%</strong><span class="muted">of this week\'s plan</span></div></div>':'<div class="ring"><div class="rn" style="position:static"><strong>Learning your week</strong><span class="muted">Add a few sessions and this fills in.</span></div></div>';
  return '<div class="card"><h2>Your week so far</h2><div class="ringrow">'+ring+'<div class="bars">'+bar('Sessions',dn,Math.max(1,wk.length))+bar('Subjects',n,4)+bar('Quizzes',qz,2)+'</div></div>'+
    '<p class="sub" style="margin-top:12px">Subjects touched this week</p><div class="dots" style="margin-top:6px">'+SUBJ.map(function(x){return '<span class="dot'+(set[x]?' on':'')+'">'+x+'</span>';}).join('')+'</div></div>';
}

        '<p class="muted" style="margin-bottom:8px">Be fair to yourself. How did you do?</p><div class="row"><button class="btn small" data-act="qmark" data-v="1">Got it</button><button class="btn small ghost" data-act="qmark" data-v="0.5">Partly</button><button class="btn small quiet" data-act="qmark" data-v="0">Not yet</button></div>';

  return h;
}

function calibText(gap,what){
  if(Math.abs(gap)<=5)return 'Your guesses are close to the real marks. That is a skill.';
  return gap>0?'You tend to guess about '+Math.round(gap)+' points higher than you score '+what+'. Checking what you really know before you stop is the fix.':'You tend to know about '+Math.round(-gap)+' points more than you expect '+what+'. Back yourself a bit more.';
}

function resize(file){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){var m=1400,w=img.width,h=img.height,k=Math.min(1,m/Math.max(w,h));var c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',0.72).split(',')[1]);};
    img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('Could not open that photo'));};
    img.src=url;
  });
}

/* UK dates (dd/mm/yyyy) and 24 hour times, whatever the browser language is set to */
(function(){
  function toUK(v){var m=/^(\d{4})-(\d\d)-(\d\d)$/.exec(v||'');return m?m[3]+'/'+m[2]+'/'+m[1]:'';}
  function fromUK(t){var m=/^(\d\d)\/(\d\d)\/(\d{4})$/.exec(t);if(!m)return '';var d=new Date(+m[3],+m[2]-1,+m[1]);if(d.getFullYear()!==+m[3]||d.getMonth()!==+m[2]-1||d.getDate()!==+m[1])return '';return m[3]+'-'+m[2]+'-'+m[1];}
  function fromT(t){var m=/^([01]\d|2[0-3]):([0-5]\d)$/.exec(t);return m?t:'';}
  function mask(s,isDate){var d=s.replace(/\D/g,'').slice(0,isDate?8:4);if(isDate){if(d.length>4)return d.slice(0,2)+'/'+d.slice(2,4)+'/'+d.slice(4);if(d.length>2)return d.slice(0,2)+'/'+d.slice(2);return d;}return d.length>2?d.slice(0,2)+':'+d.slice(2):d;}
  function upgrade(el){
    if(el.dataset.uk)return;el.dataset.uk='1';
    var isDate=el.type==='date',req=el.required;
    el.required=false;el.style.display='none';el.tabIndex=-1;
    var v=document.createElement('input');
    v.type='text';v.inputMode='numeric';v.autocomplete='off';v.className=el.className;
    v.placeholder=isDate?'dd/mm/yyyy':'hh:mm';v.maxLength=isDate?10:5;v.required=req;
    v.setAttribute('aria-label',el.getAttribute('aria-label')||(isDate?'Date: day, month, year':'Time, 24 hour clock'));
    var st=el.getAttribute('style');if(st&&st.indexOf('display')<0)v.style.cssText=st;
    v.value=isDate?toUK(el.value):el.value;
    v.addEventListener('input',function(){
      var m=mask(v.value,isDate);if(m!==v.value)v.value=m;
      var out=isDate?fromUK(m):fromT(m);
      el.value=out;
      v.setCustomValidity(m&&!out?(isDate?'Use day, month, year, like 05/11/2026':'Use 24 hour time, like 18:30'):'');
      el.dispatchEvent(new Event('change',{bubbles:true}));
    });
    el.parentNode.insertBefore(v,el);
  }
  function scan(){var l=document.querySelectorAll('input[type=date]:not([data-uk]),input[type=time]:not([data-uk])');for(var i=0;i<l.length;i++)upgrade(l[i]);}
  new MutationObserver(scan).observe(document.documentElement,{childList:true,subtree:true});
  scan();
})();

      '<div class="row" style="margin-top:8px"><button class="btn small ghost" data-act="glrecon" data-sub="'+esc(g.subject)+'">Recon</button><button class="btn small ghost" data-act="gldrill" data-sub="'+esc(g.subject)+'" data-top="'+esc(g.topic)+'">Drill</button><button class="btn small" data-act="glduel" data-id="'+g.id+'">Duel</button>'+seeBtn(g.subject,g.topic,'')+'</div>';

      else h+='<div style="margin-top:8px"><p><strong>Duel:</strong> '+esc(duel.q)+'</p><p class="sub">Take about five minutes. No clock on screen, no penalty.</p><label class="full">Your answer<textarea id="duel_a" rows="4" maxlength="1500"></textarea></label><div class="row" style="margin-top:8px"><button class="btn small" data-act="dueldone" data-id="'+g.id+'">Mark it</button><button class="btn small quiet" data-act="duelclose">Close</button></div></div>';
    }

}
/* ----- Rewrite, Access codes, Home Base ----- */
function vRewrite(){

  if(!RW){swr('rewrite','rewriteTree',{},function(r){RW=r;},function(){RW={nodes:[],themes:[],level:1};});if(!RW)return skel('reading your skill tree');}
  var subs=[];RW.nodes.forEach(function(n){if(subs.indexOf(n.subject)<0)subs.push(n.subject);});
  var h='<div class="card" data-tag="REWRITE"><h2>Rewrite</h2><p class="muted">Nodes open as you practise. Rewards are looks and titles only. Nothing is random and nothing costs money.</p></div>';
  var LK='<svg class="lk" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M6 10V8a6 6 0 0 1 12 0v2h1v11H5V10zm2 0h8V8a4 4 0 0 0-8 0z"/></svg>';
  function rwOpen(n){return !!n.unlocked&&(RW.level||1)>=(n.level||1)&&n.want>0;}

  h+='<div class="card"><h2>Looks</h2><div class="row">'+RW.themes.map(function(t){return '<button class="btn small'+(UI.theme===t.id?'':' ghost')+'"'+(t.unlocked?'':' disabled')+' data-act="theme" data-t="'+t.id+'">'+esc(t.name)+(t.unlocked?'':' (level '+t.level+')')+'</button>';}).join('')+'</div></div>';
  return h;
}
function vCodes(){

/* ----- boot screen ----- */
function pinHash(s){var h=5381;s='gp|'+s;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return String(h);}
function needPin(){return !!lsGet('gp.pin')&&lsGet('gp.pinday')!==ST.today;}
function bootTick(){
  var t=SIG.targets.filter(function(x){return x.id===bootSel;})[0],cd=document.getElementById('bcd');if(!t||!cd)return;
  var p=t.date.split('-'),hm=t.time.split(':'),at=londonToUtc(+p[0],+p[1],+p[2],+hm[0],+hm[1]),now=nowD().getTime(),ms=at-now,s=splitCountdown(ms),z=function(n){return n<10?'0'+n:String(n);};
  cd.innerHTML='<div><b>'+(ms<=0?0:countdown(t.date))+'</b><span>days</span></div><div><b>'+z(s.h)+'</b><span>hrs</span></div><div><b>'+z(s.m)+'</b><span>mins</span></div><div><b>'+z(s.s)+'</b><span>secs</span></div>';
  var bl=document.getElementById('bblk');if(bl)bl.textContent=ms<=0?'Done. Next target?':'About '+blocksLeft(ms,now)+' study blocks of 30 minutes at school pace. You only need a handful each week.'+(t.approx?' Approx: the date or time is still to be confirmed.':'');
}
function bootLines(){var l=['syncing plan .. ok',SIG.homeworkOpen+' homework open'];if(SIG.cardsDue)l.push(SIG.cardsDue+' cue cards due');if(SIG.glitchesOpen)l.push(SIG.glitchesOpen+' glitch'+(SIG.glitchesOpen===1?'':'es')+' spotted');l.push('streak '+SIG.streak+', rest days count');return l;}
function showBoot(){
  bootOn=true;var v=(lsGet('gp.visits').split(':')[0]===ST.today?Number(lsGet('gp.visits').split(':')[1])||0:0)+1;lsSet('gp.visits',ST.today+':'+v);
  var short=UI.boot==='short'||v>3,still=calmNow();
  bootSel=lsGet('gp.target');if(!SIG.targets.some(function(t){return t.id===bootSel;}))bootSel=SIG.defaultTargetId;if(!SIG.targets.some(function(t){return t.id===bootSel;}))bootSel=SIG.targets[0]?SIG.targets[0].id:'';
  bootChoice=SIG.mode||SIG.lastMode||'';
  var el=document.createElement('div');el.className='boot';el.id='boot';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');el.setAttribute('aria-label','Start screen');
  var pin=needPin();
  el.innerHTML='<div class="in">'+(pin?'':'<button class="skip" data-act="bootskip">Skip intro</button>')+
    (pin?'<div id="bpin" class="card" data-tag="DEVICE LOCK"><h2>Enter code</h2><div class="pin" id="pind"><i></i><i></i><i></i><i></i></div><p class="sub" id="pinm" style="text-align:center;margin:8px 0">Enter your 4 digit code</p><div class="keys">'+[1,2,3,4,5,6,7,8,9,'',0,'del'].map(function(k){return k===''?'<span></span>':'<button data-act="pinkey" data-k="'+k+'" aria-label="'+(k==='del'?'Delete':k)+'">'+(k==='del'?'&lt;':k)+'</button>';}).join('')+'</div></div>':'')+
    '<div id="bmain"'+(pin?' hidden':'')+'>'+(short?'':'<pre id="bt" aria-label="Loading your plan"></pre>')+'<div class="hello" id="bh"></div>'+
    '<div class="card" data-tag="COUNTDOWN"><label>Counting down to<select id="bsel">'+SIG.targets.map(function(t){return '<option value="'+t.id+'"'+(t.id===bootSel?' selected':'')+'>'+esc(examName(t.label))+(t.approx?' (approx)':'')+'</option>';}).join('')+'</select></label><div class="cd" id="bcd" role="timer" aria-live="off" tabindex="0"></div><p class="sub" id="bblk"></p></div>'+
    '<div class="card" data-tag="TODAY"><h2>Choose today\'s reality</h2><div class="choice"><button class="push'+(bootChoice==='push'?' on':'')+'" data-act="bootmode" data-m="push" aria-pressed="'+(bootChoice==='push')+'"><strong>Push</strong>Go deep. Boss practice, one stretch block, harder cards.</button><button class="steady'+(bootChoice==='steady'?' on':'')+'" data-act="bootmode" data-m="steady" aria-pressed="'+(bootChoice==='steady')+'"><strong>Steady</strong>Lighter targets. Streak protected. Rest counts.</button></div><p class="sub" style="margin-top:8px">Both choices are good choices.</p></div>'+
    '<button class="btn" id="bgo" data-act="bootgo" style="margin-top:12px">Start</button></div></div>';
  document.body.appendChild(el);document.body.classList.add('booting');if(!still)startRain();
  var gm=greetWord(),greet=gm+(SIG.name?', '+SIG.name:'')+'.\nYour plan is editable.';
  var bh=document.getElementById('bh'),bt=document.getElementById('bt');
  bh.setAttribute('aria-label',greet.replace('\n',' '));
  if(still||short){bh.textContent=greet;if(bt){bt.textContent=bootLines().join('\n');}}
  else{var L=bootLines(),i=0;(function nx(){if(!bt)return;if(i<L.length){bt.textContent+=(i?'\n':'')+'> '+L[i++];setTimeout(nx,160);}else scramble(bh,greet,800);})();}
  bootTick();bootT=setInterval(bootTick,1000);
  var go=document.getElementById('bgo');if(go&&!pin)go.focus();

function closeBoot(){
  clearInterval(bootT);var el=document.getElementById('boot');if(el)el.remove();document.body.classList.remove('booting');
  bootOn=false;bootDone=true;lsSet('gp.target',bootSel);
  var m=bootChoice||SIG.lastMode||'';
  if(m&&m!==SIG.mode){var mm=m;call('setMode',{mode:mm}).then(function(){SIG.mode=mm;SIG.lastMode=mm;render();}).catch(function(){});}
  uiApply();render();
  if(window.MX&&!calmNow()){var mm2=document.querySelector('main');if(mm2)try{MX.go(null,mm2,{style:'rain'});}catch(x){}}
}
/* ----- events ----- */
document.addEventListener('click',function(e){
  var b=e.target.closest?e.target.closest('[data-act]'):null;if(!b)return;var a=b.dataset.act;
  if(a!=='uitoggle'&&a!=='uiboot')sfx.tap();
  if(a==='bootskip'||a==='bootgo')closeBoot();
  else if(a==='bootmode'){bootChoice=b.dataset.m;if(window.MX)MX.pill(bootChoice==='push'?'red':'blue',e);[].forEach.call(document.querySelectorAll('#boot .choice button'),function(x){var on=x.dataset.m===bootChoice;x.classList.toggle('on',on);x.setAttribute('aria-pressed',on?'true':'false');});}
  else if(a==='pinkey'){var k=b.dataset.k;if(k==='del')pinBuf=pinBuf.slice(0,-1);else if(pinBuf.length<4)pinBuf+=k;
    [].forEach.call(document.querySelectorAll('#pind i'),function(d,i){d.classList.toggle('on',i<pinBuf.length);});
    if(pinBuf.length===4){if(pinHash(pinBuf)===lsGet('gp.pin')){lsSet('gp.pinday',ST.today);pinBuf='';var bp=document.getElementById('bpin'),bm=document.getElementById('bmain');if(bp)bp.remove();if(bm)bm.hidden=false;var sk=document.createElement('button');sk.className='skip';sk.dataset.act='bootskip';sk.textContent='Skip intro';document.querySelector('#boot .in').insertBefore(sk,document.querySelector('#boot .in').firstChild);}
      else{pinBuf='';var pm=document.getElementById('pinm');if(pm)pm.textContent='Not that one. Try again.';[].forEach.call(document.querySelectorAll('#pind i'),function(d){d.classList.remove('on');});}}}
  else if(a==='pinset'){var v=(document.getElementById('pin_new')||{}).value||'';if(!/^\d{4}$/.test(v)){toast('Four digits please');return;}lsSet('gp.pin',pinHash(v));lsSet('gp.pinday',ST.today);toast('Device lock on');render();}
  else if(a==='pinclear'){lsSet('gp.pin','');toast('Device lock off');render();}
  else if(a==='avmenu'){if(avMenu)menuClose();else menuOpen();}
  else if(a==='sigmode'){var m=b.dataset.m;if(window.MX)MX.pill(m==='push'?'red':'blue',e);call('setMode',{mode:m}).then(function(){SIG.mode=m;SIG.lastMode=m;toast(m==='push'?'Push it is.':'Steady it is.');render();}).catch(function(x){toast(x.message);});}
  else if(a==='txopen'){txOpen=true;render();var q=document.getElementById('txq');if(q)scramble(q,TXD.question,700);}
  else if(a==='txdone'&&!txBusy){txBusy=true;call('transmissionAnswer',{confidence:b.dataset.c}).then(function(r){txBusy=false;TXD.done=true;sfx.xp();toast(r.xp?'+'+r.xp+' XP':'Received. XP limit reached for today, that is fine.');return loadSignal();}).then(render).catch(function(x){txBusy=false;toast(x.message);});}
  else if(a==='seecode'){codeOpen={sub:b.dataset.sub,top:b.dataset.top,busy:true,data:null};render();call('seeCode',{subject:b.dataset.sub,topic:b.dataset.top,text:b.dataset.txt}).then(function(r){codeOpen.busy=false;codeOpen.data=r;render();}).catch(function(){if(codeOpen){codeOpen.busy=false;render();}});}
  else if(a==='codeclose'){codeOpen=null;render();}
  else if(a==='simsdone'){call('simsDone',{title:b.dataset.t}).then(function(r){sfx.xp();toast(r.already?'Already counted today':r.xp?'Program complete. +'+r.xp+' XP':'Program complete. XP limit reached for today, that is fine.');return loadSignal();}).then(render).catch(function(x){toast(x.message);});}
  else if(a==='glrecon'){libSubj=b.dataset.sub;tab='library';toast('Finish a shard on '+b.dataset.sub+' to hit it.');render();}
  else if(a==='gldrill'){cardSubj=b.dataset.sub;cardTopicPre=b.dataset.top;cardOut=null;cardPhase='';tab='cards';render();}
  else if(a==='glduel'){duel={id:b.dataset.id,q:'',live:false,busy:true,res:null};render();call('glitchDuel',{id:b.dataset.id}).then(function(r){duel.busy=false;duel.q=r.question;render();}).catch(function(x){duel={id:'',q:'',busy:false,res:null};toast(x.message);render();});}
  else if(a==='dueldone'){var ta=document.getElementById('duel_a');duel.busy=true;render();call('glitchDuel',{id:duel.id,step:'mark',answer:ta?ta.value:''}).then(function(r){duel.busy=false;duel.res=r;if(r.hit)sigEvent(r.hit);GL=null;return loadSignal();}).then(function(){render();}).catch(function(x){duel.busy=false;toast(x.message);render();});}
  else if(a==='duelclose'){duel={id:'',q:'',busy:false,res:null};render();}
  else if(a==='wear'){call('setProfile',{values:{title:b.dataset.t}}).then(function(){toast('Title set');return loadSignal();}).then(render).catch(function(x){toast(x.message);});}
  else if(a==='theme'){uiSet('theme',b.dataset.t);}
});
document.addEventListener('change',function(e){var t=e.target,a=t.dataset&&t.dataset.act;if(a==='uitoggle')uiSet(t.dataset.k,t.checked);else if(a==='uiboot')uiSet('boot',t.value);else if(t.id==='bsel'){bootSel=t.value;bootTick();}});
(function(){var tm=0;document.addEventListener('pointerdown',function(e){if(e.target.closest&&e.target.closest('.hud')){tm=setTimeout(function(){uiSet('calm',!UI.calm);toast(UI.calm?'Calm mode on':'Calm mode off');},800);}});['pointerup','pointercancel','pointerleave'].forEach(function(n){document.addEventListener(n,function(){clearTimeout(tm);});});})();
document.addEventListener('click',function(e){var b=e.target.closest?e.target.closest('[data-act="tab"]'):null;if(b)avMenu=false;},true);
document.addEventListener('click',function(e){var b=e.target.closest?e.target.closest('[data-act]'):null;if(!b)return;var a=b.dataset.act;
  if(a==='intel'){var k='gp.intel.'+b.dataset.k;lsSet(k,lsGet(k)==='1'?'0':'1');render();}

    if(e.shiftKey&&i<=0){e.preventDefault();f[f.length-1].focus();}else if(!e.shiftKey&&i===f.length-1){e.preventDefault();f[0].focus();}}
});
window.addEventListener('popstate',function(){if(avMenu){avMenu=false;render();}});
(function(){var x0=null;document.addEventListener('touchstart',function(e){if(avMenu&&e.touches&&e.touches[0])x0=e.touches[0].clientX;},{passive:true});
  document.addEventListener('touchend',function(e){if(avMenu&&x0!==null&&e.changedTouches&&e.changedTouches[0]&&e.changedTouches[0].clientX-x0<-60)menuClose();x0=null;},{passive:true});})();
window.__gp={londonToUtc:londonToUtc,splitCountdown:splitCountdown,blocksLeft:blocksLeft,scramble:scramble,rainOn:function(){return rain.on;},ui:UI};
uiLoad();
function bootNeeded(){return isRohan()&&ST&&SIG&&!bootOn&&!bootDone&&UI.boot!=='off'&&!(typeof obShow==='function'&&obShow());}

if(CODE)boot();else{render();window.__mxDone=true;__mxb.progress(1,'ready');__mxb.ready();}
})();
