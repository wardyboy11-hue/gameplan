/* ---------- scoring suitability ---------- */
function fit(p,pos){var a=effPos(p),i=a.indexOf(pos);if(i===0)return 4;if(i>0)return 3;
 for(var j=0;j<ALIAS.length;j++){var g=ALIAS[j];if(g.indexOf(pos)>-1){for(var k=0;k<a.length;k++){if(g.indexOf(a[k])>-1)return 2;}}}
 for(var m=0;m<a.length;m++){if(LINE[a[m]]===LINE[pos]&&pos!=='GK'&&a[m]!=='GK')return 1;}return 0;}
function fitTag(f){return f>=3?'<span class="tag good">Natural</span>':f===2?'<span class="tag">Close fit</span>':f===1?'<span class="tag warn">Same line</span>':'<span class="tag bad">Not usual</span>';}

function newMatch(){var s=S.settings;return {id:uid(),opp:'',date:isoToday(),ko:'10:30',ha:'H',venue:'',addr:'',comp:'League',formation:'4231',half:s.half||35,avail:{},lineup:{},status:'plan',period:1,clock:{acc:0,running:false,t0:0},stints:{},events:[],ratings:{},notes:'',lastWin:0,updatedAt:0};}
function isoToday(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function niceDate(s){if(!s)return '';var p=s.split('-');var d=new Date(+p[0],+p[1]-1,+p[2]);return d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});}
function msec(m){var c=m.clock;return Math.floor(c.acc+(c.running?(now()-c.t0)/1000:0));}
function fmt(sec){var mm=Math.floor(sec/60),ss=sec%60;return String(mm).padStart(2,'0')+':'+String(ss).padStart(2,'0');}
function slotsOf(m){return FORMS[m.formation].s;}
function slotOfPlayer(m,pid){for(var k in m.lineup){if(m.lineup[k]===pid)return k;}return null;}
function mins(m,pid,t){var a=m.stints[pid]||[],sum=0;for(var i=0;i<a.length;i++){sum+=((a[i].out==null?t:a[i].out)-a[i].in);}return sum;}

function slotInfo(m,k){var s=slotsOf(m).filter(function(x){return x.k===k;})[0];return s;}

 m.stints={};for(var k in m.lineup){var pid=m.lineup[k];(m.stints[pid]=m.stints[pid]||[]).push({in:0,out:null,slot:k});}
 m.events.push({id:uid(),t:0,type:'ko'});}
function pause(m){if(m.clock.running){m.clock.acc+=(now()-m.clock.t0)/1000;m.clock.running=false;}}
function resume(m){if(!m.clock.running){m.clock.t0=now();m.clock.running=true;}}
function doSub(m,offId,onId){var t=msec(m),slot=slotOfPlayer(m,offId);var a=m.stints[offId];var st=a[a.length-1];st.out=t;(m.stints[onId]=m.stints[onId]||[]).push({in:t,out:null,slot:slot});m.lineup[slot]=onId;m.events.push({id:uid(),t:t,type:'sub',pid:onId,aid:offId,slot:slot});}
function doSwap(m,k1,k2){var t=msec(m),p1=m.lineup[k1],p2=m.lineup[k2];[[p1,k2],[p2,k1]].forEach(function(x){var a=m.stints[x[0]];var st=a[a.length-1];st.out=t;a.push({in:t,out:null,slot:x[1]});});m.lineup[k1]=p2;m.lineup[k2]=p1;m.events.push({id:uid(),t:t,type:'swap',pid:p1,aid:p2,slot:k2});}
function finish(m){var t=msec(m);pause(m);for(var pid in m.stints){var a=m.stints[pid];var st=a[a.length-1];if(st&&st.out==null)st.out=t;}m.status='done';m.events.push({id:uid(),t:t,type:'ft'});}

function call(action,p){
 var body=JSON.stringify(Object.assign({code:CODE,action:action},p||{}));
 return fetch(API,{method:'POST',body:body,headers:{'Content-Type':'text/plain;charset=utf-8'},redirect:'follow'}).then(function(r){return r.json();}).then(function(j){if(!j.ok)throw new Error(j.error||'Failed');return j.data;});
}
function schedSync(){clearTimeout(syncTimer);syncTimer=setTimeout(function(){sync();},4000);}
function docFor(key){var p=key.split(':'),o=p[0]==='player'?S.players[p[1]]:p[0]==='match'?S.matches[p[1]]:p[0]==='idea'?S.ideas[p[1]]:S.settings;return o?{kind:p[0],id:p[1],updatedAt:o.updatedAt,json:JSON.stringify(o)}:null;}
function sync(manual){
 if(!CODE||syncing)return Promise.resolve();
 if(API.indexOf('__'+'API__')>-1){return Promise.resolve();}
 syncing=true;paintStatus();
 var keys=Object.keys(S.dirty),stamps={};
 var docs=keys.map(function(k){var d=docFor(k);if(d)stamps[k]=d.updatedAt;return d;}).filter(Boolean);
 return call('sync',{docs:docs,since:S.lastSync}).then(function(d){
  d.docs.forEach(function(r){var o;try{o=JSON.parse(r.json);}catch(e){return;}var key=r.kind+':'+r.id;var cur=r.kind==='player'?S.players[r.id]:r.kind==='match'?S.matches[r.id]:r.kind==='idea'?S.ideas[r.id]:S.settings;
   if(cur&&S.dirty[key]&&cur.updatedAt>=r.updatedAt)return;
   if(cur&&cur.updatedAt>=r.updatedAt)return;
   if(r.kind==='player')S.players[r.id]=o;else if(r.kind==='match')S.matches[r.id]=o;else if(r.kind==='idea')S.ideas[r.id]=o;else S.settings=o;});
  keys.forEach(function(k){var cur=docFor(k);if(!cur||cur.updatedAt===stamps[k])delete S.dirty[k];});
  S.lastSync=d.serverTime;online=true;lastMsg='Synced '+new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});persist();syncing=false;paintStatus();if(manual)toast('Synced');render(true);
 }).catch(function(e){syncing=false;if(/code/i.test(e.message)&&/work|wrong|not/i.test(e.message)){CODE='';lsSet(CKEY,'');lastMsg='';render();toast('That code did not work');return;}online=false;lastMsg='Saved on this phone';paintStatus();if(manual)toast('No signal. Saved on this phone.');});
}

function suggestXI(m){
 var pool=availPlayers(m),st={};statsFor().forEach(function(r){st[r.p.id]=r;});
 var slots=slotsOf(m).slice(),lineup={},used={};
 slots.sort(function(a,b){return (a.pos==='GK'?0:1)-(b.pos==='GK'?0:1);});
 function isGK(p){return (p.pos||[]).indexOf('GK')>-1;}
 function pick(s,strict){var best=null,bs=-1e9;pool.forEach(function(p){if(used[p.id])return;
  if(strict){if(s.pos==='GK'&&!isGK(p))return;if(s.pos!=='GK'&&isGK(p)&&(p.pos||[]).length===1)return;}
  var r=st[p.id]||{start:0,mins:0},sc=fit(p,s.pos)*10-r.start*3-r.mins/600;if(sc>bs){bs=sc;best=p;}});return best;}
 slots.forEach(function(s){var b=pick(s,true);if(b){lineup[s.k]=b.id;used[b.id]=true;}});
 slots.forEach(function(s){if(lineup[s.k])return;var b=pick(s,false);if(b){lineup[s.k]=b.id;used[b.id]=true;}});
 return lineup;
}

var LKC={};
function slotSide(s){return /^R/.test(s.k)?'R':/^L/.test(s.k)?'L':'C';}
function posSide(c){return /^R/.test(c)?'R':/^L/.test(c)?'L':'C';}
function labEdges(form){if(LKC[form])return LKC[form];var s=FORMS[form].s,seen={},E=[];
 s.forEach(function(a,i){var d=[];s.forEach(function(b,j){if(i===j)return;var dx=a.x-b.x,dy=(a.y-b.y)*1.1;d.push({j:j,d:Math.sqrt(dx*dx+dy*dy)});});d.sort(function(x,y){return x.d-y.d;});
  d.slice(0,a.pos==='GK'?2:3).forEach(function(o){var k=Math.min(i,o.j)+'-'+Math.max(i,o.j);if(!seen[k]){seen[k]=1;E.push([Math.min(i,o.j),Math.max(i,o.j)]);}});});
 LKC[form]=E;return E;}
function nodeScore(p,s){var f=fit(p,s.pos),ns=f>=4?1:f===3?0.9:f===2?0.6:f===1?0.3:0,why=[];
 if(f===0)why.push('Not usually a '+s.pos+(effPos(p).length?' (plays '+effPos(p).join(', ')+')':' (no positions set)'));
 else if(f===1)why.push('Same line but not a usual '+s.pos);
 else if(f===2)why.push('Close fit for '+s.pos);
 var S_=slotSide(s),pos=effPos(p),foot=effFoot(p);
 if(S_!=='C'&&pos.length){var has=pos.some(function(c){return posSide(c)===S_||posSide(c)==='C';});if(!has){ns-=0.25;why.push('Plays the other side of the pitch');}}
 if(S_==='L'&&foot==='L')ns+=0.1;else if(S_==='R'&&foot==='R')ns+=0.1;
 else if(S_==='L'&&foot==='R'&&s.pos!=='CB'){why.push('Right footed on the left');}
 else if(S_==='R'&&foot==='L'&&s.pos!=='CB'){why.push('Left footed on the right');}
 return {v:Math.max(0,Math.min(1,ns)),why:why,f:f};}
function labChem(m){var sl=slotsOf(m),E=labEdges(m.formation),N={},L=[];
 sl.forEach(function(s){var pid=m.lineup[s.k];if(pid&&P(pid))N[s.k]=nodeScore(P(pid),s);});
 E.forEach(function(e){var a=sl[e[0]],b=sl[e[1]],na=N[a.k],nb=N[b.k];if(!na||!nb)return;var v=0.4*(na.v+nb.v)/2+0.6*Math.min(na.v,nb.v);L.push({a:a,b:b,v:v,c:v>=0.75?'g':v>=0.45?'a':'r'});});
 var per={},tot=0,n=0;sl.forEach(function(s){var nd=N[s.k];if(!nd)return;var mine=L.filter(function(l){return l.a.k===s.k||l.b.k===s.k;}),avg=mine.length?mine.reduce(function(t,l){return t+l.v;},0)/mine.length:nd.v;var c=0.5*nd.v+0.5*avg;per[s.k]={c:c,n:Math.round(c*10),cls:c>=0.75?'g':c>=0.45?'a':'r'};tot+=c;n++;});
 return {N:N,L:L,per:per,team:n?Math.round(tot/n*100):0,n:n};}
function labPool(){return Object.keys(S.matches).map(function(k){return S.matches[k];}).filter(function(m){return !m.deleted&&m.status==='plan'&&m.date>=isoToday();}).sort(function(a,b){return a.date<b.date?-1:1;});}
function labM(){var pool=labPool(),id=labS.mid||(pool[0]&&pool[0].id)||'';if(id!=='scratch'){var m=id&&S.matches[id];if(m&&m.status==='plan'&&!m.deleted){labS.mid=id;return m;}}
 var sc=S.settings.lab;if(!sc){sc=S.settings.lab={formation:'4231',lineup:{},avail:{}};}if(!sc.avail)sc.avail={};labS.mid='scratch';return sc;}
function labSave(m){if(m===S.settings.lab)touch('settings',S.settings);else saveM(m);}
function labAvail(m,p){return m.avail[p.id]!==false;}
function labPlace(pid,k){var m=labM(),old=slotOfPlayer(m,pid),prev=m.lineup[k];if(old===k)return;if(old){if(prev)m.lineup[old]=prev;else delete m.lineup[old];}m.lineup[k]=pid;labS.sel='';labSave(m);render(true);}
function labRemove(pid){var m=labM(),k=slotOfPlayer(m,pid);if(k){delete m.lineup[k];labSave(m);render(true);}}
function labRemap(m,f){var old=m.lineup,ids=Object.keys(old).map(function(k){return old[k];}),nl={},used={};m.formation=f;
 slotsOf(m).forEach(function(s){if(old[s.k]){nl[s.k]=old[s.k];used[old[s.k]]=1;}});
 slotsOf(m).forEach(function(s){if(nl[s.k])return;var best=null,bf=0;ids.forEach(function(id){if(used[id]||!P(id))return;var ft=fit(P(id),s.pos);if(ft>bf){bf=ft;best=id;}});if(best){nl[s.k]=best;used[best]=1;}});m.lineup=nl;}
var ROLEW={0:['gkh','gkd','comm','cool','iq','touch'],1:['posn','head','comm','pace','str','cool','pass'],2:['pass','touch','iq','work','fit','posn','drib'],3:['shot','pace','drib','touch','work','iq']};
function roleRate(p,line){var a=ROLEW[line],t=0,n=0;a.forEach(function(k){var v=rateAny(p,k);if(v!==null){t+=v;n++;}});return n?t/n:null;}
function labAuto(){var m=labM(),pl=plist().filter(function(p){return labAvail(m,p);}),used={},lu={};
 var order=slotsOf(m).slice().sort(function(a,b){return (a.pos==='GK'?0:1)-(b.pos==='GK'?0:1);});
 order.forEach(function(s){var best=null,bs=-1;pl.forEach(function(p){if(used[p.id])return;var f=fit(p,s.pos);if(s.pos==='GK'&&f<3)return;if(s.pos!=='GK'&&effPos(p).length===1&&effPos(p)[0]==='GK')return;var rr=roleRate(p,LINE[s.pos]);var sc=f*10+(rr===null?4:rr)+nodeScore(p,s).v*4;if(sc>bs){bs=sc;best=p;}});if(best){lu[s.k]=best.id;used[best.id]=1;}});
 m.lineup=lu;labSave(m);render(true);}
/* ---- selection review ---- */
function avgOf(list,k){var t=0,n=0;list.forEach(function(p){var v=rateAny(p,k);if(v!==null){t+=v;n++;}});return n?t/n:null;}
function labReview(m,ch){var sl=slotsOf(m),xi=[],bylnes={0:[],1:[],2:[],3:[]};
 sl.forEach(function(s){var pid=m.lineup[s.k];if(pid&&P(pid)){var p=P(pid);xi.push({p:p,s:s});bylnes[LINE[s.pos]].push(p);}});
 if(xi.length<7)return '<div class="card"><h3 style="margin-top:0">Selection review</h3><p class="small muted">Pick at least seven players and the review shows up here.</p></div>';
 var ps=xi.map(function(x){return x.p;}),rated=ps.filter(function(p){return rateAny(p,'pass')!==null||profPairs(p).length>2;}).length;
 var roleVals=xi.map(function(x){return roleRate(x.p,LINE[x.s.pos]);}).filter(function(v){return v!==null;});
 var ability=roleVals.length?roleVals.reduce(function(a,b){return a+b;},0)/roleVals.length:null;
 var overall=ability===null?null:Math.round(0.6*ability*10+0.4*ch.team);
 var keys=SK.filter(function(x){return !x.gk;}).map(function(x){return {k:x.k,n:x.n,v:avgOf(ps,x.k)};}).filter(function(x){return x.v!==null;}).sort(function(a,b){return b.v-a.v;});
 var good=keys.filter(function(x){return x.v>=6.5;}).slice(0,3),weak=keys.slice().reverse().filter(function(x){return x.v<=5;}).slice(0,3);
 var look=[],watch=[],pn=function(p){return shortName(p);};
 /* shape and balance */
 var posn=xi.filter(function(x){return x.s.pos!=='GK'&&fit(x.p,x.s.pos)<=1;});
 if(posn.length)look.push('Out of position: '+posn.map(function(x){return pn(x.p)+' at '+x.s.pos;}).join(', ')+'. Tell them their job in one line before kick off.');
 var Ls=xi.filter(function(x){return slotSide(x.s)==='L'&&x.s.pos!=='CB'}),Rs=xi.filter(function(x){return slotSide(x.s)==='R'&&x.s.pos!=='CB'});
 if(Ls.length&&Ls.every(function(x){return effFoot(x.p)==='R';}))look.push('Nobody left footed down the left. Expect them to cut inside onto the right foot. Use the touchline to help them.');
 if(Rs.length&&Rs.every(function(x){return effFoot(x.p)==='L';}))look.push('Nobody right footed down the right. Same story the other way.');
 if(!xi.some(function(x){return x.s.pos==='GK'&&fit(x.p,'GK')>=3;}))watch.push('No natural keeper in the side. Give him a clear job: talk, and keep it simple.');
 /* line by line */
 var dpace=avgOf(bylnes[1],'pace'),dcomm=avgOf(bylnes[1].concat(bylnes[0]),'comm'),mtouch=avgOf(bylnes[2],'touch'),mwork=avgOf(bylnes[2],'work'),ashot=avgOf(bylnes[3],'shot'),dhead=avgOf(bylnes[1],'head');
 if(dpace!==null&&dpace<=5)watch.push('Back line is not quick ('+dpace.toFixed(1)+'). Do not leave them one v one in space. Hold a deeper line and keep the ball in front of them.');
 if(dcomm!==null&&dcomm<=5)watch.push('Quiet at the back ('+dcomm.toFixed(1)+'). Nobody loud. Ask your best talker to run the line.');
 if(mtouch!==null&&mtouch<=5)look.push('Midfield first touch is a worry ('+mtouch.toFixed(1)+'). Give them a bounce player and tell them to play first time when pressed.');
 if(mwork!==null&&mwork>=7)look.push('Strong engine in midfield ('+mwork.toFixed(1)+'). Use it: press as a unit and win it high.');
 if(ashot!==null&&ashot<=5)look.push('Finishing could be thin up top ('+ashot.toFixed(1)+'). Chances may not go in. Keep making them and praise the movement.');
 if(dhead!==null&&dhead<=5)watch.push('Not strong in the air at the back. Keep the ball on the floor and defend crosses early.');
 /* individuals */
 var calmL=[],fadeL=[];xi.forEach(function(x){var c=rateAny(x.p,'cool'),f=rateAny(x.p,'fit');if(c!==null&&c<=4)calmL.push(pn(x.p));if(f!==null&&f<=4)fadeL.push(pn(x.p));});
 if(calmL.length)watch.push('Can lose their heads: '+calmL.join(', ')+'. Sit them next to a calm player, agree a signal and know who comes on if it boils over.');
 if(fadeL.length)watch.push('May fade late: '+fadeL.join(', ')+'. Plan the changes around the 45th minute.');
 /* opponent */
 var sc=(m.scout||[]).concat(scoutHist(m).map(function(h){return h.n;}));
 sc.forEach(function(n){var t=String(n.txt||'').toLowerCase();
  if(/quick|pace|fast|rapid/.test(t)&&(n.tag==='danger'||/striker|winger|forward|number|#/.test(t))&&dpace!==null&&dpace<=6)watch.push('Their note: "'+n.txt+'". Our back line is not the quickest. Hold a deeper line.');
  if(/tall|big|aerial|strong|physical/.test(t)&&dhead!==null&&dhead<=6)watch.push('Their note: "'+n.txt+'". We are not the strongest in the air. Defend set pieces early.');});
 var h='<div class="card"><h3 style="margin-top:0">Selection review</h3><div class="row" style="gap:8px;text-align:center"><div class="grow it" style="display:block"><div style="font-size:26px;font-weight:800">'+(overall===null?'?':overall)+'</div><div class="small muted">Rating</div></div><div class="grow it" style="display:block"><div style="font-size:26px;font-weight:800;color:'+(ch.team>=75?'#4ADE80':ch.team>=45?'#FFB81C':'#F87171')+'">'+ch.team+'</div><div class="small muted">Chemistry</div></div><div class="grow it" style="display:block"><div style="font-size:26px;font-weight:800">'+(ability===null?'?':ability.toFixed(1))+'</div><div class="small muted">Ability out of 10</div></div></div>';
 if(rated<xi.length)h+='<p class="small muted" style="margin-top:8px">Only '+rated+' of '+xi.length+' have ratings. Rate the rest in their profiles for a sharper review.</p>';
 if(good.length)h+='<p class="small"><b>Strengths:</b> '+esc(good.map(function(x){return x.n+' '+x.v.toFixed(1);}).join(', '))+'</p>';
 if(weak.length)h+='<p class="small"><b>Weaker areas:</b> '+esc(weak.map(function(x){return x.n+' '+x.v.toFixed(1);}).join(', '))+'</p>';
 if(look.length)h+='<h3>What to look for and support</h3><ul class="small" style="margin:4px 0 0 18px;padding:0">'+look.map(function(t){return '<li>'+esc(t)+'</li>';}).join('')+'</ul>';
 if(watch.length)h+='<h3>Dangers to watch</h3><ul class="small" style="margin:4px 0 0 18px;padding:0">'+watch.map(function(t){return '<li>'+esc(t)+'</li>';}).join('')+'</ul>';
 if(!look.length&&!watch.length)h+='<p class="small">No red flags from what is rated so far.</p>';
 h+='<button class="btn block" style="margin-top:12px" data-act="labAsk">Get a second opinion from the staff</button><p class="small muted">Ratings and chemistry are for you and Deano only. Never show them to players or parents.</p></div>';
 labS.ask=ratingsBrief(m,xi,ch,overall);return h;}
function ratingsBrief(m,xi,ch,overall){return 'Review this U15 selection for me. Formation '+m.formation+(m.opp?', against '+m.opp:'')+'. Use shirt numbers only. Team chemistry '+ch.team+'/100'+(overall!==null?', rating '+overall:'')+'. Line up: '+xi.map(function(x){var ks=profPairs(x.p).sort(function(a,b){return b.v-a.v;});return x.s.pos+' #'+(x.p.num||'?')+' (foot '+(effFoot(x.p)||'?')+', plays '+(effPos(x.p).join('/')||'?')+(ks.length?'; best '+ks.slice(0,2).map(function(i){return i.n+' '+i.v;}).join(', ')+'; work on '+ks.slice(-2).map(function(i){return i.n+' '+i.v;}).join(', '):'')+')';}).join('; ')+'. Tell me strengths, weaknesses, what to look for to support the side and what to watch out for. Plain Northern English, short lines.';}

 h+='<div class="lab" id="labroot"><div class="stripw"><div class="strip" id="labstrip">'+strip+'</div></div><div class="labp"><div class="pitch"><svg viewBox="0 0 100 124" preserveAspectRatio="none"><rect x="2" y="2" width="96" height="120"/><line x1="2" y1="62" x2="98" y2="62"/><circle cx="50" cy="62" r="11"/><rect x="24" y="2" width="52" height="20"/><rect x="38" y="2" width="24" height="8"/><rect x="24" y="102" width="52" height="20"/><rect x="38" y="114" width="24" height="8"/></svg>'+svg+slots+'</div></div></div>';

document.addEventListener('pointerdown',function(e){var el=e.target.closest&&e.target.closest('[data-drag]');if(!el||!document.getElementById('labroot'))return;if(e.pointerType==='mouse'&&e.button!==0)return;
 DGX.src=el;DGX.sx=e.clientX;DGX.sy=e.clientY;DGX.active=false;clearTimeout(DGX.timer);
 DGX.timer=setTimeout(function(){if(!DGX.src)return;DGX.active=true;var g=document.createElement('div');g.className='dgg';g.innerHTML=DGX.src.querySelector('.av,.num')?DGX.src.querySelector('.av,.num').outerHTML:'';g.style.left=DGX.sx+'px';g.style.top=DGX.sy+'px';document.body.appendChild(g);DGX.g=g;try{if(navigator.vibrate)navigator.vibrate(15);}catch(x){}},230);});
document.addEventListener('pointermove',function(e){if(!DGX.src)return;if(!DGX.active){if(Math.abs(e.clientX-DGX.sx)+Math.abs(e.clientY-DGX.sy)>10&&!DGX.g){clearTimeout(DGX.timer);if(e.pointerType==='mouse'){DGX.active=true;var g=document.createElement('div');g.className='dgg';g.innerHTML=DGX.src.querySelector('.av,.num')?DGX.src.querySelector('.av,.num').outerHTML:'';document.body.appendChild(g);DGX.g=g;}else{DGX.src=null;}}if(!DGX.active)return;}
 if(DGX.g){DGX.g.style.left=e.clientX+'px';DGX.g.style.top=e.clientY+'px';}
 var t=dgTarget(e.clientX,e.clientY);if(DGX.over&&(!t||t.el!==DGX.over)){DGX.over.classList.remove('dgo');DGX.over=null;}if(t&&t.el&&t.t==='slot'){t.el.classList.add('dgo');DGX.over=t.el;}e.preventDefault();});
document.addEventListener('pointerup',function(e){if(!DGX.src)return;var was=DGX.active,src=DGX.src,pid=src.dataset.pid;if(was){var t=dgTarget(e.clientX,e.clientY);DGX.just=1;setTimeout(function(){DGX.just=0;},350);dgClean();
  if(t&&t.t==='slot')labPlace(pid,t.k);else if(t&&t.t==='strip'&&src.dataset.drag==='slot')labRemove(pid);else if(!t&&src.dataset.drag==='slot')labRemove(pid);}else dgClean();});
document.addEventListener('pointercancel',function(){dgClean();});
document.addEventListener('touchmove',function(e){if(DGX.active)e.preventDefault();},{passive:false});

 var nm=ms[0];
 if(nm&&nm.date===td){h+=mdCard(nm);}else if(nm){h+='<div class="card kcard"><h3 style="margin-top:0">Next match</h3><h2>'+(nm.ha==='A'?'at ':'v ')+esc(nm.opp)+(nm.pp?' (postponed)':'')+'</h2><p><b>'+niceDate(nm.date)+'</b>, '+esc(nm.ko)+(nm.venue?'<br>'+esc(nm.venue):'')+'</p><div class="row"><button class="btn pri" data-act="openMatch" data-id="'+nm.id+'">Open match</button>'+((nm.addr||nm.venue)?'<a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(nm.addr||nm.venue)+'">Directions</a>':'')+'</div></div>';}
 else h+='<div class="card"><h3 style="margin-top:0">Next match</h3><p class="muted">No match in the diary.</p></div>';
 var ps=(S.settings.posts||[]).filter(function(x){return x.date>=td;}).sort(function(a,b){return a.date<b.date?-1:1;})[0];
 if(ps)h+='<div class="card"><h3 style="margin-top:0">Next on the family page</h3><h2>'+esc(ps.title)+'</h2><p><b>'+niceDate(ps.date)+'</b>'+(ps.time?', '+esc(ps.time):'')+'</p><button class="btn block" data-act="tab" data-v="plan">Open plan</button></div>';
 var hb=view.hub||{},pe=(hb.ev||[]).filter(function(e){return e.status==='pending';}).length,pm=(hb.media||[]).filter(function(e){return e.status==='pending';}).length,ol=(hb.lifts||[]).length;
 h+='<div class="card"><h3 style="margin-top:0">Needs you</h3>'+((pe+pm)?'<p>'+(pe?pe+' event'+(pe>1?'s':'')+' to check. ':'')+(pm?pm+' media item'+(pm>1?'s':'')+' to check.':'')+'</p>':'<p class="muted">Nothing waiting.</p>')+'<p class="small muted">'+ol+' lift note'+(ol===1?'':'s')+' from families.</p><button class="btn block" data-act="tab" data-v="hub">Open Comms</button></div>';
 var d=chkState();
 h+='<div class="card"><h3 style="margin-top:0">Match day checklist</h3><p class="small muted">Resets each day. Stays on this phone.</p>'+CHK.map(function(t,i){return '<label class="chk" style="display:flex;gap:10px;align-items:center;min-height:48px"><input type="checkbox" style="width:26px;height:26px;min-height:26px" data-chk="'+i+'"'+(d['k'+i]?' checked':'')+'> '+esc(t)+'</label>';}).join('')+'</div>';
 var cp=(S.settings.comp||[]).filter(function(c){return c.exp&&c.exp<=addDays(td,60);});
 if(cp.length)h+='<div class="card" style="border-color:#FB7185"><h3 style="margin-top:0">Coming up for renewal</h3>'+cp.map(function(c){return '<p>'+esc(c.n)+': '+esc(c.what)+', '+(c.exp<td?'expired ':'ends ')+niceDate(c.exp)+'</p>';}).join('')+'<button class="btn block" data-act="tab" data-v="admin">Welfare and admin</button></div>';
 var pn=S.settings.pain||{},pl=plist().filter(function(p){return pn[p.id]&&pn[p.id]>=addDays(td,-7);});
 if(pl.length)h+='<div class="card" style="border-color:var(--amber)"><h3 style="margin-top:0">Load watch</h3><p>'+pl.map(function(p){return esc(shortName(p));}).join(', ')+': cut jumping and repeated sprinting this week.</p></div>';
 return h;}
function addDays(iso,n){var p=iso.split('-'),d=new Date(+p[0],+p[1]-1,+p[2]+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function vAdmin(){
 var td=isoToday(),s=S.settings,h='<h2 style="margin:6px 0">Welfare and admin</h2><p class="small muted">Coach only. Families and players never see this page.</p>';
 var pn=s.pain||{};
 h+='<div class="card"><h3 style="margin-top:0">Growth pain watch</h3><p class="small muted">A note only, not a diagnosis. If a player reports knee, heel or lower back pain, tap his name. Today shows a load watch reminder for seven days: cut jumping and repeated sprinting for him.</p><div class="chips">'+plist().map(function(p){var on=pn[p.id]&&pn[p.id]>=addDays(td,-7);return '<button class="chip'+(on?' on':'')+'" data-act="painTog" data-id="'+p.id+'">'+esc(shortName(p))+'</button>';}).join('')+'</div></div>';
 var cs=(s.comp||[]).slice().sort(function(a,b){return (a.exp||'9')<(b.exp||'9')?-1:1;});
 h+='<div class="card"><h3 style="margin-top:0">Coach compliance dates</h3><p class="small muted">DBS, safeguarding course, first aid and licence expiry for you and Deano.</p>'+(cs.length?cs.map(function(c){var late=c.exp&&c.exp<td,soon=c.exp&&!late&&c.exp<=addDays(td,60);return '<div class="it"><div class="grow"><b>'+esc(c.n)+'</b><div class="small muted">'+esc(c.what)+(c.exp?' · '+(late?'expired ':'ends ')+niceDate(c.exp):'')+'</div></div>'+(late?'<span class="tag" style="background:#7f1d33">Expired</span>':soon?'<span class="tag" style="background:#6b4a0a">Soon</span>':'')+'<button class="btn" data-act="compDel" data-id="'+c.id+'">Remove</button></div>';}).join(''):'<p class="muted">None added yet.</p>')+'<label>Who</label><select id="cmn"><option>Tim</option><option>Deano</option></select><label>What</label><select id="cmw"><option>DBS</option><option>Safeguarding course</option><option>First aid</option><option>FA coaching licence</option><option>Other</option></select><label>Ends on</label><input id="cmd" type="date"><button class="btn pri block" style="margin-top:10px" data-act="compAdd">Add date</button></div>';
 var nf=plist().filter(function(p){return !p.fan;});
 h+='<div class="card"><h3 style="margin-top:0">Registration check</h3>'+(nf.length?'<p>No FAN number on file for: '+nf.map(function(p){return esc(shortName(p));}).join(', ')+'.</p>':'<p>Every player has a FAN number on file.</p>')+'<p class="small muted">Add a FAN number from the player profile in Squad.</p></div>';
 return h;}
function vAtt(){
 var s=S.settings,dt=view.attDate||isoToday(),a=(s.att||{})[dt]||{},pl=plist();
 var h='<h2 style="margin:6px 0">Attendance</h2><p class="small muted">Coach only. Use it with the training review for selection evidence, never as a ranking.</p><div class="card"><label style="margin-top:0">Session date</label><input type="date" id="attd" value="'+dt+'"><h3>Who was there ('+Object.keys(a).length+' of '+pl.length+')</h3><div class="chips">'+pl.map(function(p){return '<button class="chip'+(a[p.id]?' on':'')+'" data-act="attTog" data-id="'+p.id+'">'+esc(shortName(p))+'</button>';}).join('')+'</div></div>';
 var all=s.att||{},ds=Object.keys(all).sort().slice(-10);
 if(ds.length){h+='<div class="card"><h3 style="margin-top:0">Last '+ds.length+' sessions</h3>'+pl.map(function(p){var n=ds.filter(function(d){return all[d][p.id];}).length;return '<div class="it"><div class="grow">'+esc(shortName(p))+'</div><b>'+n+' of '+ds.length+'</b></div>';}).join('')+'</div>';}
 return h;}
Object.assign(ACT,{
 painTog:function(d){var s=S.settings,pn=s.pain=s.pain||{},td=isoToday();if(pn[d.id]&&pn[d.id]>=addDays(td,-7))delete pn[d.id];else pn[d.id]=td;touch('settings',s);sync();render(true);},
