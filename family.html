<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06102B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Blues">
<title>Wigan Junior Latics U15 Blues</title>
<link rel="apple-touch-icon" href="coach/icon-192.png">
<style>
:root{--bg:#06102B;--card:#0E1D45;--card2:#15295A;--line:#27407F;--ink:#F4F6FC;--muted:#A6B2D4;--amber:#FFB81C;--gold:#C9A24B;--good:#4ADE80;--bad:#FB7185}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.45}
.stripe{height:10px;background:repeating-linear-gradient(90deg,#021945 0 18px,#fff 18px 25px,#021945 25px 43px);border-bottom:2px solid var(--gold)}
.wrap{max-width:560px;margin:0 auto;padding:0 14px 40px}
header{display:flex;align-items:center;gap:10px;padding:14px 0 6px}
header img{height:42px}header h1{font-size:19px;margin:0;flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
h2{font-size:18px;margin:0 0 6px}h3{font-size:13px;margin:12px 0 4px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
p{margin:6px 0}.muted{color:var(--muted)}.small{font-size:13px}
input,textarea{width:100%;background:#0A173A;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;min-height:48px}
textarea{min-height:90px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card2);font:inherit;font-weight:700;color:var(--ink);cursor:pointer}
.btn.pri{background:var(--amber);color:#1b1200;border-color:var(--amber)}.btn.block{display:flex;width:100%}
.row{display:flex;gap:8px;margin-top:10px}.row .btn{flex:1}
.yn .btn.on.y{background:#14532d;border-color:#4ADE80}.yn .btn.on.m{background:#6b4a0a;border-color:var(--amber)}.yn .btn.on.n{background:#7f1d33;border-color:var(--bad)}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:2px 8px;background:#26407a;color:#cfe0ff;text-transform:uppercase}
.ans{background:#0A173A;border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}
.err{color:var(--bad);min-height:1.2em}
a{color:#9db8ff}
</style>
</head>
<body>
<div class="stripe"></div>
<div class="wrap" id="root"></div>
<script>
var API=window.TL_API||'https://script.google.com/macros/s/AKfycby3YUAg5QncW-hb2tKDapu108F2RDlgEhFmluVsXPctKdlLP33ADPbVcJ8kEJSLmoij/exec';
var CK='fam.code',OK='fam.ok1',CODE=g(CK),D=null,askA='',askBusy=false,showPriv=false,showHelp=false,msg='';
function g(k){try{return localStorage.getItem(k)||'';}catch(e){return '';}}
function s(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function call(action,p){return fetch(API,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({code:CODE,action:action},p||{}))}).then(function(r){return r.json();}).then(function(j){if(!j.ok)throw new Error(j.error||'Failed');return j.data;});}
function nice(d){var p=String(d).split('-');if(p.length<3)return d;return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});}
var HELP='<h2>How to use this page</h2><h3>Add it to your phone</h3><p>iPhone: open the page in Safari, tap the Share button, then Add to Home Screen. Android: open it in Chrome, tap the three dots, then Add to Home screen or Install app.</p><h3>Signing in</h3><p>Type the family code Tim sent you. You only do it once on each phone.</p><h3>Can he come?</h3><p>Tap Yes, Maybe or No under each session or match. You can change your answer any time.</p><h3>Objectives and reminders</h3><p>Look at the top of the page for his objectives, what we have been working on, and game day reminders.</p><h3>Ask</h3><p>Type a football question. Answers are general advice. For pain or injury see your GP or physio.</p><h3>Stuck?</h3><p>Ask Tim at training.</p>';
var PRIV='<h2>Privacy: how this page uses your information</h2>'+
'<h3>Who runs it</h3><p>Tim Ward, manager of Wigan Junior Latics U15 Blues. Deano helps as assistant coach.</p>'+
'<h3>What we hold about your family</h3><p>Your family code. Your player\'s first name, photo and FAN number, taken from the FA squad list, and his date of birth (so we can wish him a happy birthday). Your Yes, No or Maybe answers for training and matches. Any personal objectives we write for him. Any question you type into Ask.</p>'+
'<h3>What we do not hold here</h3><p>No phone numbers, addresses or email addresses. No medical details. No scores, ratings or ability notes. You only ever see your own player\'s photo, FAN number and objectives, never anyone else\'s.</p>'+
'<h3>Why</h3><p>To plan sessions and teams around who can come, and to help you and your player with football questions. We use it only to run the team.</p>'+
'<h3>Who sees it</h3><p>Only your family, Tim and Deano. We do not share it or sell it. Tim and Deano can see the questions asked in Ask, so we can check the help is safe.</p>'+
'<h3>Ask uses AI</h3><p>When you send a question, the words you type are sent to an AI service (Anthropic\'s Claude) to write an answer. Please do not type names, medical details or anything private. The answers are general football advice. They are not medical advice and they are not a coaching decision. For pain or injury, see your GP or physio.</p>'+
'<h3>Where it is kept and for how long</h3><p>In a private Google Sheet run by Tim. We keep it until the end of the season, then delete it.</p>'+
'<h3>Your rights</h3><p>You can ask to see it, correct it or have it deleted at any time. Just ask Tim. If you are not happy, you can complain to the Information Commissioner\'s Office at ico.org.uk.</p>'+
'<h3>If you are worried about a child</h3><p>Do not use this page. Speak to Tim or the club welfare officer. In an emergency, ring 999.</p>'+
'<h3>Using this page</h3><p>By using it you confirm you are a parent or carer, or a player with your parent\'s okay.</p>';
var SPON='<div style="display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:6px 12px;margin:6px 0 4px;color:#0b1330;font-size:12px;font-weight:700"><span style="flex:1">Proudly sponsored by</span><img src="coach/mfs.png" alt="MFS Limited" style="height:34px"></div>';
var SHOP='https://empirekits.co.uk/collections/wigan-junior-latics-blues',FT='https://fulltime.thefa.com/displayTeam.html?divisionseason=344446019&teamID=837121388',showKit=false,resImg='',resTitle='';
function kitPage(){var k=[['home','Home kit'],['away','Away kit'],['gkgreen','Goalkeeper kit, green'],['gkgrey','Goalkeeper kit, grey'],['bundle','Player bundle']];
 return '<div class="card"><h2>Kit and club shop</h2><p class="small muted">Our kit is made by Empire Kits and sponsored by MFS Limited. Order through the club shop.</p><a class="btn pri block" href="'+SHOP+'" target="_blank" rel="noopener">Open the club shop</a></div>'+k.map(function(x){return '<div class="card"><h3 style="margin-top:0">'+x[1]+'</h3><img src="coach/kit/'+x[0]+'.jpg" alt="'+x[1]+'" style="width:100%;border-radius:10px;display:block"></div>';}).join('')+'<button class="btn block" onclick="showKit=false;r();window.scrollTo(0,0)">Back</button>';}
function openRes(t){resTitle=t;resImg='loading';r();call('f.res',{title:t}).then(function(d){resImg=d.dataUrl;r();}).catch(function(e){resImg='';alert(e.message);r();});}
function r(){var el=document.getElementById('root'),h='<header><img src="coach/badge.png" alt=""><h1>Wigan Junior Latics U15 Blues</h1></header>'+SPON;
 if(!CODE||!D){h+='<div class="card"><h2>Family page</h2><p class="muted">Type the family code Tim sent you.</p><input id="code" placeholder="ABC 123" autocapitalize="characters" autocomplete="off"><div class="err" id="err">'+esc(msg)+'</div><button class="btn pri block" onclick="login()">Open</button></div><p class="small muted">Need a code? Ask Tim at training.</p><p class="small"><a href="#" onclick="showPriv=!showPriv;r();return false">Privacy</a></p>'+(showPriv?'<div class="card">'+PRIV+'</div>':'');el.innerHTML=h;return;}
 if(g(OK)!=='1'){h+='<div class="card">'+PRIV+'<button class="btn pri block" style="margin-top:14px" onclick="s(OK,\'1\');r()">I have read this and I am happy to carry on</button></div>';el.innerHTML=h;return;}
 if(showKit){el.innerHTML=h+kitPage();return;}
 if(resImg){h+='<div class="card"><h2>'+esc(resTitle)+'</h2>'+(resImg==='loading'?'<p class="muted">Loading</p>':'<img src="'+resImg+'" alt="'+esc(resTitle)+'" style="width:100%;border-radius:10px;display:block"><p class="small muted">Pinch to zoom. Private to your family.</p>')+'<button class="btn block" style="margin-top:10px" onclick="resImg=\'\';r()">Back</button></div>';el.innerHTML=h;return;}
 h+='<div class="card" style="display:flex;gap:14px;align-items:center">'+(D.photo?'<img src="'+esc(D.photo)+'" alt="" style="width:84px;height:84px;border-radius:14px;object-fit:cover">':'')+'<div><h2 style="margin:0">'+esc(D.first)+'</h2>'+(D.fan?'<p class="small muted" style="margin:4px 0 0">FAN number<br><b style="color:#fff;font-size:17px;letter-spacing:1px">'+esc(D.fan)+'</b></p>':'')+'</div></div><p class="small muted" style="margin-top:-4px">Keep the FAN number safe in case you ever need it for FA or league forms.</p>';
 if(D.bday)h+='<div class="card" style="border-color:#FFB81C"><h2>Happy birthday, '+esc(D.first)+'!</h2><p>'+(D.age?'Happy '+D.age+'th from everyone at Wigan Junior Latics U15 Blues. ':'')+'Have a cracking day. Tim and Deano.</p></div>';
 if(D.obj)h+='<div class="card"><h2>'+esc(D.first)+'\'s objectives</h2><p>'+esc(D.obj).replace(/\n/g,'<br>')+'</p><p class="small muted">Chosen by Tim and Deano. Just things to try, never a mark out of ten.</p></div>';
 if(D.working)h+='<div class="card"><h2>What we have been working on</h2><p>'+esc(D.working).replace(/\n/g,'<br>')+'</p></div>';
 if(!D.posts.length)h+='<div class="card"><h2>Nothing posted yet</h2><p class="muted">The next session will appear here once Tim has posted it.</p></div>';
 D.posts.forEach(function(p){var a=D.mine[p.id]||'';
  h+='<div class="card"><span class="tag">'+(p.type==='match'?'Match':'Training')+'</span><h2 style="margin-top:8px">'+esc(p.title)+'</h2><p><b>'+esc(nice(p.date))+'</b>'+(p.time?', '+esc(p.time):'')+(p.place?'<br>'+esc(p.place):'')+'</p>'+
  (p.why?'<h3>Why we are doing it</h3><p>'+esc(p.why).replace(/\n/g,'<br>')+'</p>':'')+(p.bring?'<h3>Bring</h3><p>'+esc(p.bring)+'</p>':'')+
  '<h3>Can '+esc(D.first)+' come?</h3><div class="row yn"><button class="btn y'+(a==='Y'?' on':'')+'" onclick="ans(\''+p.id+'\',\'Y\')">Yes</button><button class="btn m'+(a==='M'?' on':'')+'" onclick="ans(\''+p.id+'\',\'M\')">Maybe</button><button class="btn n'+(a==='N'?' on':'')+'" onclick="ans(\''+p.id+'\',\'N\')">No</button></div></div>';});
 h+=voteCards();
 if(D.tips)h+='<div class="card"><h2>Game day reminders</h2><p>'+esc(D.tips).replace(/\n/g,'<br>')+'</p></div>';
 if((D.res||[]).length)h+='<div class="card"><h2>Resources for '+esc(D.first)+'</h2>'+D.res.map(function(t){return '<button class="btn block" style="margin-top:8px" onclick="openRes(\''+t.replace(/\\/g,'\\\\').replace(/'/g,"\\'")+'\')">'+esc(t)+'</button>';}).join('')+'</div>';
 h+='<div class="card"><h2>Kit and club shop</h2><p class="small muted">See our kit and order from the club shop.</p><button class="btn pri block" onclick="showKit=true;r();window.scrollTo(0,0)">See the kit</button></div><div class="card"><h2>Fixtures, results and table</h2><p class="small muted">Opens our team page on FA Full Time. Sign in with your FA account if it asks.</p><a class="btn block" href="'+FT+'" target="_blank" rel="noopener">Open our team page</a><p class="small muted" style="margin-top:12px">Prefer an app? The FA Matchday app shows fixtures, results and league tables on your phone. Download it, then search for our team.</p><a class="btn block" href="https://www.englandfootball.com/explore/helpful-apps-and-websites/matchday" target="_blank" rel="noopener">Get the FA Matchday app</a></div>';
 h+='<div class="card"><h2>Ask a football question</h2><p class="small muted">Ask about a football term, practising at home, sleep, food and drink for sport, nerves and confidence. General advice only, no medical advice. Please do not type names or private details.</p><textarea id="q" placeholder="For example: what should we practise at home to improve first touch?"></textarea><button class="btn pri block" style="margin-top:10px" onclick="ask()"'+(askBusy?' disabled':'')+'>'+(askBusy?'Thinking':'Ask')+'</button>'+(askA?'<div class="ans">'+esc(askA).replace(/\n/g,'<br>')+'</div>':'')+'</div>';
 h+='<p class="small"><a href="#" onclick="showHelp=!showHelp;r();return false">How to use</a> &nbsp; <a href="#" onclick="showPriv=!showPriv;r();return false">Privacy</a> &nbsp; <a href="#" onclick="out();return false">Sign out</a></p>'+(showHelp?'<div class="card">'+HELP+'</div>':'')+(showPriv?'<div class="card">'+PRIV+'</div>':'');
 el.innerHTML=h;}
function voteCards(){var V=D.vote||{},h='';
 [['motm','Man of the match','Pick your man of the match. One vote per family, and not your own player.'],['poty','Player of the year','Pick your player of the year. One vote per family, and not your own player.']].forEach(function(x){var v=V[x[0]]||{open:false};
  if(!v.open){h+='<div class="card"><h2>'+x[1]+'</h2><p class="muted">Voting is closed for now. Tim will open it when it is time.</p></div>';return;}
  h+='<div class="card" style="border-color:#FFB81C"><h2>'+x[1]+(v.label?': '+esc(v.label):'')+'</h2><p class="small muted">'+x[2]+' Vote for effort, attitude and team play, not just goals.</p><div class="row" style="flex-wrap:wrap;gap:8px">'+v.cands.map(function(c){return '<button class="btn'+(v.mine===c.id?' pri':'')+'" onclick="vote(\''+x[0]+'\',\''+c.id+'\')">'+esc(c.name)+'</button>';}).join('')+'</div>'+(v.mine?'<p class="small">Vote saved. You can change it until voting closes.</p>':'')+'</div>';});
 return h;}
function vote(k,c){D.vote[k].mine=c;r();call('f.vote',{kind:k,cand:c}).catch(function(e){alert(e.message);load();});}
function load(){return call('f.home').then(function(d){D=d;r();}).catch(function(e){if(/code/i.test(e.message)){CODE='';s(CK,'');}msg=e.message;D=null;r();});}
function login(){var v=document.getElementById('code').value.trim();if(!v)return;CODE=v;msg='Checking';document.getElementById('err').textContent='Checking';call('f.home').then(function(d){s(CK,v);D=d;msg='';r();}).catch(function(e){CODE='';msg=e.message;r();});}
function ans(id,a){D.mine[id]=a;r();call('f.answer',{postId:id,answer:a}).catch(function(e){alert(e.message);load();});}
function ask(){var q=document.getElementById('q').value.trim();if(q.length<3)return;askBusy=true;askA='';r();document.getElementById('q').value=q;call('f.ask',{q:q}).then(function(d){askA=d.text;askBusy=false;r();}).catch(function(e){askA=e.message;askBusy=false;r();});}
function out(){CODE='';D=null;s(CK,'');r();}
if(CODE)load();else r();
</script>
</body>
</html>
