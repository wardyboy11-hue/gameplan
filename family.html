var HELP='<h2>How to use this page</h2><h3>Add it to your phone</h3><p>iPhone: open the page in Safari, tap the Share button, then Add to Home Screen. Android: open it in Chrome, tap the three dots, then Add to Home screen or Install app.</p><h3>Signing in</h3><p>Type the code Tim sent you. Parents have a family code and players have their own player code. You only do it once on each phone.</p><h3>Can he come?</h3><p>Tap Yes, Maybe or No under each session or match. You can change your answer any time.</p><h3>Objectives and reminders</h3><p>Look at the top of the page for his objectives, what we have been working on, and game day reminders.</p><h3>Ask</h3><p>Type a football question. Answers are general advice. For pain or injury see your GP or physio.</p><h3>Tabs</h3><p>Home has the welcome message, reminders, objectives and session answers. Games has fixtures, results and the lift board. Events lists team nights and extras. Me has your picture, the calendar and the kit.</p><h3>Lifts</h3><p>Tap I can give a lift or I need a lift under a game. Add your area and notes if you want. Other families only see your first name and area. Only Tim and Deano see the notes. You can speak the notes with the microphone, but only when it is safe to do so.</p><h3>Calendar</h3><p>On the Me tab, add the Latics calendar to your phone. Postponed games show as cancelled.</p><h3>Match day help</h3><p>On match day a red box appears on Home. Use it if you are late, cannot get there or need help. It alerts Tim and Deano.</p><h3>Stuck?</h3><p>Ask Tim at training.</p>';
var PRIV='<h2>Privacy: how this page uses your information</h2>'+
'<h3>Who runs it</h3><p>Tim Ward, manager of Wigan Junior Latics U15 Blues. Deano helps as assistant coach.</p>'+
'<h3>What we hold about your family</h3><p>Your family code and your player\'s own player code. Your player\'s first name, photo and FAN number, taken from the FA squad list, and his date of birth (so we can wish him a happy birthday). Your Yes, No or Maybe answers for training and matches. Any personal objectives we write for him. Any question you type into Ask. Lift offers and requests (your first name, general area and any notes you type), events you post, and your picture.</p>'+
'<h3>What we do not hold here</h3><p>No phone numbers or email addresses. Any address you type for a lift is seen only by Tim and Deano. No medical details. No scores, ratings or ability notes. You only ever see your own player\'s photo, FAN number and objectives, never anyone else\'s.</p>'+
'<h3>Why</h3><p>To plan sessions and teams around who can come, and to help you and your player with football questions. We use it only to run the team.</p>'+
'<h3>Who sees it</h3><p>Only your family, Tim and Deano. We do not share it or sell it. Tim and Deano can see the questions asked in Ask, so we can check the help is safe.</p>'+
'<h3>Ask uses AI</h3><p>When you send a question, the words you type are sent to an AI service (Anthropic\'s Claude) to write an answer. Please do not type names, medical details or anything private. The answers are general football advice. They are not medical advice and they are not a coaching decision. For pain or injury, see your GP or physio.</p>'+
'<h3>Where it is kept and for how long</h3><p>In a private Google Sheet run by Tim. We keep it until the end of the season, then delete it.</p>'+
'<h3>Your rights</h3><p>You can ask to see it, correct it or have it deleted at any time. Just ask Tim. If you are not happy, you can complain to the Information Commissioner\'s Office at ico.org.uk.</p>'+
'<h3>If you are worried about a child</h3><p>Do not use this page. Speak to Tim or the club welfare officer. In an emergency, ring 999.</p>'+
'<h3>Using this page</h3><p>By using it you confirm you are a parent or carer, or a player with your parent\'s okay.</p>';

function liftBox(ref,title,date){
 var L=X().lifts.filter(function(l){return l.ref===ref;}),mine=L.filter(function(l){return l.mine;}),off=L.filter(function(l){return l.type==='offer';}),need=L.filter(function(l){return l.type==='need';});

 else h+='<p class="small muted">Nobody has asked or offered yet.</p>';
 var mo=mine.filter(function(l){return l.type==='offer';})[0],mn=mine.filter(function(l){return l.type==='need';})[0];
 var e=function(x){return String(x).replace(/\\/g,'\\\\').replace(/'/g,"\\'");};
 h+='<div class="row"><button class="btn'+(mo?' okb':'')+'" onclick="liftTick(\''+e(ref)+'\',\''+e(title)+'\',\''+date+'\',\'offer\')">'+(mo?'&#10003; ':'')+'I can give a lift</button><button class="btn'+(mn?' okb':'')+'" onclick="liftTick(\''+e(ref)+'\',\''+e(title)+'\',\''+date+'\',\'need\')">'+(mn?'&#10003; ':'')+'I need a lift</button></div>';
 if(mine.length){h+='<button class="btn block" style="margin-top:8px" onclick="liftTick(\''+e(ref)+'\',\''+e(title)+'\',\''+date+'\',\'clear\')">Clear mine</button>';}
 h+='<button class="btn block" style="margin-top:8px" onclick="liftOpen=(liftOpen===\''+e(ref)+'\'?\'\':\''+e(ref)+'\');r()">'+(liftOpen===ref?'Hide details':'Add details (area, address, voice)')+'</button>';
 if(liftOpen===ref){var cur=mo||mn||{};h+='<div class="ans"><label class="small">Area (other families see this)</label><input id="lar" value="'+esc(cur.area||'')+'" placeholder="For example: Standish"><label class="small">Pickup address or notes (only Tim and Deano see this)</label><div style="display:flex;gap:6px"><textarea id="lde" style="min-height:70px" placeholder="Address, times, anything useful"></textarea>'+(window.SpeechRecognition||window.webkitSpeechRecognition?'<button class="btn" style="width:56px" onclick="mic()" aria-label="Speak">&#127908;</button>':'')+'</div><label class="small">Seats (if offering)</label><input id="lse" type="number" min="0" max="8" value="'+esc(cur.seats||'')+'"><div class="row"><button class="btn pri" onclick="liftSave(\''+e(ref)+'\',\''+e(title)+'\',\''+date+'\',\''+(mn&&!mo?'need':'offer')+'\')">Save</button></div><p class="small muted">Tap the microphone and speak, handy if you are driving. Do not use it while the car is moving unless it is hands free.</p></div>';}
 return h+'</div>';}

function smallJpeg(file,cb){var fr=new FileReader();fr.onload=function(){var im=new Image();im.onload=function(){var sz=Math.min(im.width,im.height),sx=(im.width-sz)/2,sy=(im.height-sz)/2,d=220,q=0.8,c=document.createElement('canvas');c.width=d;c.height=d;c.getContext('2d').drawImage(im,sx,sy,sz,sz,0,0,d,d);var u=c.toDataURL('image/jpeg',q);while(u.length>38000&&q>0.3){q-=0.1;u=c.toDataURL('image/jpeg',q);}cb(u);};im.src=fr.result;};fr.readAsDataURL(file);}

 return h;}
function bodyGames(){var x=X(),up=x.fixtures.filter(function(m){return !m.done;}),dn=x.fixtures.filter(function(m){return m.done;}).reverse();
 var h='<div class="card"><h2>Games</h2><p class="small muted">Fixtures, results and Man of the match so far. Away games have a lift board. For the league table use FA Full Time.</p></div>';
 h+=(up.length?up.map(fxCard).join(''):'<div class="card"><p class="muted">No games listed yet.</p></div>');
 if(dn.length)h+='<h2 style="margin:18px 0 0">Results</h2>'+dn.map(fxCard).join('');
 h+='<div class="card"><a class="btn block" href="'+FT+'" target="_blank" rel="noopener">Open FA Full Time for the table</a></div>';
 return h;}
function bodyEvents(){var x=X(),h='<div class="card"><h2>Events</h2><p class="small muted">Team nights, fundraisers and anything else going on.'+(D.role==='parent'?' Parents can add one below. Tim checks it first.':'')+'</p></div>';
 if(alertMsg&&tab==='events')h+='<div class="card"><p class="small">'+esc(alertMsg)+'</p></div>';
 h+=(x.events.length?x.events.map(function(e){return '<div class="card"><div>'+(e.pending?'<span class="tag" style="background:#7a3b00">Waiting for Tim</span>':'')+(e.coach?'':'<span class="tag">Parent</span>')+'</div><h2 style="margin-top:6px">'+esc(e.title)+'</h2><p><b>'+esc(nice(e.date))+'</b>'+(e.time?', '+esc(e.time):'')+(e.place?'<br>'+esc(e.place):'')+'</p>'+(e.note?'<p class="small">'+esc(e.note)+'</p>':'')+(e.link?'<a class="btn block" style="margin-top:6px" href="'+esc(e.link)+'" target="_blank" rel="noopener">Open the link</a>':'')+(e.pending?'':'<div class="row"><a class="btn" target="_blank" rel="noopener" href="'+gcal(e.title,e.date,e.time,e.place,e.note)+'">Add to calendar</a><button class="btn" onclick="wa(\''+esc(String(e.title).replace(/'/g,''))+' - '+esc(nice(e.date))+(e.time?' at '+esc(e.time):'')+'. More: https://game.cipher-training.co.uk/family\')">WhatsApp</button></div>')+'</div>';}).join(''):'<div class="card"><p class="muted">Nothing listed yet.</p></div>');
 if(D.role==='parent'){h+=evForm?'<div class="card"><h2>Add an event</h2><input id="evt" placeholder="Title"><div class="row"><input id="evd" type="date"><input id="evh" type="time"></div><input id="evp" placeholder="Place" style="margin-top:8px"><input id="evl" placeholder="Link (optional)" style="margin-top:8px"><textarea id="evn" style="min-height:70px;margin-top:8px" placeholder="Note (optional)"></textarea><div class="row"><button class="btn pri" onclick="evAdd()">Send to Tim</button><button class="btn" onclick="evForm=false;r()">Cancel</button></div><p class="small muted">Please do not put private details or names of children you do not know. Links must start with https.</p></div>':'<button class="btn pri block" onclick="evForm=true;r()">Add an event</button>';}
 return h;}
function bodyMe(){var x=X(),cp=x.coachPhotos||{},h='';
 h+='<div class="card"><h2>My picture</h2><div style="display:flex;gap:12px;align-items:center">'+(D.photo?'<img src="'+esc(D.photo)+'" alt="" style="width:84px;height:84px;border-radius:14px;object-fit:cover">':'<div style="width:84px;height:84px;border-radius:14px;background:#15295A"></div>')+'<label class="btn">Choose a picture<input type="file" accept="image/*" style="display:none" onchange="upl(this)"></label></div><p class="small muted">Shows on the squad list for Tim and Deano and on your page. A clear face picture works best.</p></div>';
 h+='<div class="card"><h2>Latics calendar</h2><p class="small muted">Games, training and events, with reminders. If a game is postponed or cancelled it shows as cancelled on your calendar. This link is only for your family, please do not share it.</p><a class="btn pri block" href="'+esc(calUrl().replace(/^https:/,'webcal:'))+'">Add to Apple or Outlook calendar</a><a class="btn block" style="margin-top:8px" target="_blank" rel="noopener" href="https://calendar.google.com/calendar/r?cid='+encodeURIComponent(calUrl().replace(/^https:/,'webcal:'))+'">Add to Google Calendar</a><p class="small muted">Calendars refresh every few hours, so a change can take a little while to show.</p></div>';
 if((D.res||[]).length)h+='<div class="card"><h2>Resources for '+esc(D.first)+'</h2>'+D.res.map(function(t){return '<button class="btn block" style="margin-top:8px" onclick="openRes(\''+t.replace(/\\/g,'\\\\').replace(/'/g,"\\'")+'\')">'+esc(t)+'</button>';}).join('')+'</div>';
 h+='<div class="card"><h2>2025/26 award winners</h2><p class="small">Players: Charlie Catterall<br>Parents: Andre Medeiros<br>Coaches: Tom Penistone and Jacob Daven</p></div>';
 h+='<div class="card"><h2>Your coaches</h2><div style="display:flex;align-items:center;gap:12px;margin-bottom:10px">'+(cp.tim?'<img src="'+esc(cp.tim)+'" alt="Tim" style="width:72px;height:72px;border-radius:50%;object-fit:cover">':'')+'<div><b>Tim</b><div class="small muted">Manager</div></div></div><div style="display:flex;align-items:center;gap:12px"><img src="'+esc(cp.deano||'coach/deano.jpg')+'" alt="Deano" style="width:72px;height:72px;border-radius:50%;object-fit:cover"><div><b>Deano</b><div class="small muted">Assistant coach</div></div></div></div>';
 h+='<div class="card"><h2>Kit and club shop</h2><p class="small muted">See our kit and order from the club shop.</p><button class="btn pri block" onclick="showKit=true;r();window.scrollTo(0,0)">See the kit</button></div><div class="card"><h2>Fixtures, results and table</h2><p class="small muted">Opens our team page on FA Full Time. Sign in with your FA account if it asks.</p><a class="btn block" href="'+FT+'" target="_blank" rel="noopener">Open our team page</a><p class="small muted" style="margin-top:12px">Prefer an app? The FA Matchday app shows fixtures, results and league tables on your phone. Download it, then search for our team.</p><a class="btn block" href="https://www.englandfootball.com/explore/helpful-apps-and-websites/matchday" target="_blank" rel="noopener">Get the FA Matchday app</a></div>';
 h+='<div class="card"><h2>Ask a football question</h2><p class="small muted">Ask about a football term, practising at home, sleep, food and drink for sport, nerves and confidence. General advice only, no medical advice. Please do not type names or private details.</p><textarea id="q" placeholder="For example: what should we practise at home to improve first touch?"></textarea><button class="btn pri block" style="margin-top:10px" onclick="ask()"'+(askBusy?' disabled':'')+'>'+(askBusy?'Thinking':'Ask')+'</button>'+(askA?'<div class="ans">'+esc(askA).replace(/\n/g,'<br>')+'</div>':'')+'</div>';
 h+='<p class="small"><a href="#" onclick="showHelp=!showHelp;r();return false">How to use</a> &nbsp; <a href="#" onclick="showPriv=!showPriv;r();return false">Privacy</a> &nbsp; <a href="#" onclick="out();return false">Sign out</a></p>'+(showHelp?'<div class="card">'+HELP+'</div>':'')+(showPriv?'<div class="card">'+PRIV+'</div>':'');
 return h;}
function bodyHomePosts(){var h='';
 h+='<div class="card" style="display:flex;gap:14px;align-items:center">'+(D.photo?'<img src="'+esc(D.photo)+'" alt="" style="width:84px;height:84px;border-radius:14px;object-fit:cover">':'')+'<div><h2 style="margin:0">'+esc(D.first)+(D.cap?' <span style="font-size:13px;background:#FFB81C;color:#050D24;border-radius:6px;padding:2px 8px;vertical-align:middle">'+(D.cap==='C'?'Captain':'Vice captain')+'</span>':'')+'</h2>'+(D.honours?'<p class="small" style="margin:6px 0 0">'+esc(D.honours).replace(/\n/g,'<br>')+'</p>':'')+(D.fan?'<p class="small muted" style="margin:4px 0 0">FAN number<br><b style="color:#fff;font-size:17px;letter-spacing:1px">'+esc(D.fan)+'</b></p>':'')+'</div></div><p class="small muted" style="margin-top:-4px">Keep the FAN number safe in case you ever need it for FA or league forms.</p>';
 if(D.bday)h+='<div class="card" style="border-color:#FFB81C"><h2>Happy birthday, '+esc(D.first)+'!</h2><p>'+(D.age?'Happy '+D.age+'th from everyone at Wigan Junior Latics U15 Blues. ':'')+'Have a cracking day. Tim and Deano.</p></div>';
 if(D.obj)h+='<div class="card"><h2>'+esc(D.first)+'\'s objectives</h2><p>'+esc(D.obj).replace(/\n/g,'<br>')+'</p><p class="small muted">Chosen by Tim and Deano. Just things to try, never a mark out of ten.</p></div>';
 if(D.working)h+='<div class="card"><h2>What we have been working on</h2><p>'+esc(D.working).replace(/\n/g,'<br>')+'</p></div>';
 if(!D.posts.length)h+='<div class="card"><h2>Nothing posted yet</h2><p class="muted">The next session will appear here once Tim has posted it.</p></div>';
 D.posts.forEach(function(p){var a=D.mine[p.id]||'';var fx=p.type==='match'?X().fixtures.filter(function(m){return m.date===p.date&&!m.done;})[0]:null;
  h+='<div class="card"><span class="tag">'+(p.type==='match'?'Match':'Training')+'</span><h2 style="margin-top:8px">'+esc(p.title)+'</h2><p><b>'+esc(nice(p.date))+'</b>'+(p.time?', '+esc(p.time):'')+(p.place?'<br>'+esc(p.place):'')+'</p>'+
  (p.why?'<h3>Why we are doing it</h3><p>'+esc(p.why).replace(/\n/g,'<br>')+'</p>':'')+(p.bring?'<h3>Bring</h3><p>'+esc(p.bring)+'</p>':'')+
  '<h3>'+(D.role==='player'?'Can you come?':'Can '+esc(D.first)+' come?')+'</h3><div class="row yn"><button class="btn y'+(a==='Y'?' on':'')+'" onclick="ans(\''+p.id+'\',\'Y\')">Yes</button><button class="btn m'+(a==='M'?' on':'')+'" onclick="ans(\''+p.id+'\',\'M\')">Maybe</button><button class="btn n'+(a==='N'?' on':'')+'" onclick="ans(\''+p.id+'\',\'N\')">No</button></div>'+(fx&&(a==='Y'||a==='M')?liftBox(fx.id,fxTitle(fx),fx.date):'')+'</div>';});
 h+=voteCards();
 if(D.tips)h+='<div class="card"><h2>Game day reminders</h2><p>'+esc(D.tips).replace(/\n/g,'<br>')+'</p></div>';
 return h;}
function r(){var el=document.getElementById('root'),h='<header><img src="coach/badge.png" alt=""><h1>Wigan Junior Latics U15 Blues</h1></header>'+SPON;
 if(!CODE||!D){h+='<div class="card"><h2>Family page</h2><p class="muted">Type the code Tim sent you. Parents have a family code and players have their own player code.</p><input id="code" placeholder="ABC 123" autocapitalize="characters" autocomplete="off"><div class="err" id="err">'+esc(msg)+'</div><button class="btn pri block" onclick="login()">Open</button></div><p class="small muted">Need a code? Ask Tim at training.</p><p class="small"><a href="#" onclick="showPriv=!showPriv;r();return false">Privacy</a></p>'+(showPriv?'<div class="card">'+PRIV+'</div>':'');el.innerHTML=h;return;}
 if(g(OK)!=='1'){h+='<div class="card">'+PRIV+'<button class="btn pri block" style="margin-top:14px" onclick="s(OK,\'1\');r()">I have read this and I am happy to carry on</button></div>';el.innerHTML=h;return;}
 if(showKit){el.innerHTML=h+kitPage();return;}
 if(resImg){h+='<div class="card"><h2>'+esc(resTitle)+'</h2>'+(resImg==='loading'?'<p class="muted">Loading</p>':resBody(resTitle,resImg))+'<button class="btn block" style="margin-top:10px" onclick="resImg=\'\';r()">Back</button></div>';el.innerHTML=h;return;}
 h+=tab==='games'?bodyGames():tab==='events'?bodyEvents():tab==='me'?bodyMe():(bodyHome()+bodyHomePosts());
 el.innerHTML=h+navBar();}
function voteCards(){var V=D.vote||{},h='';
 [['motm','Man of the match','Parents vote for the man of the match. Coaches vote too.'],['poty','Player of the year','Parents, players and coaches each vote for their own player of the year.']].forEach(function(x){var v=V[x[0]]||{open:false};
  if(!v.open){h+='<div class="card"><h2>'+x[1]+'</h2><p class="muted">Voting is closed for now. Tim will open it when it is time.</p></div>';return;}
  if(!v.elig){h+='<div class="card"><h2>'+x[1]+'</h2><p class="muted">'+(D.role==='player'?'Parents and coaches vote for this one.':'Voting is not open to you.')+'</p></div>';return;}
  var m=v.mine||[],pts=['1st choice, 3 points','2nd choice, 2 points','3rd choice, 1 point'];
  h+='<div class="card" style="border-color:#FFB81C"><h2>'+x[1]+(v.label?': '+esc(v.label):'')+'</h2><p class="small muted">'+x[2]+' Pick your top three: 3 points for first, 2 for second, 1 for third. '+(D.role==='player'?'Not yourself.':'Not your own player.')+' Vote for effort, attitude and team play, not just goals.</p>'+[0,1,2].map(function(i){return '<label class="small">'+pts[i]+'</label><select id="v_'+x[0]+i+'" style="width:100%;margin-bottom:8px"><option value="">Choose</option>'+v.cands.map(function(c){return '<option value="'+c.id+'"'+(m[i]===c.id?' selected':'')+'>'+esc(c.name)+'</option>';}).join('')+'</select>';}).join('')+'<button class="btn pri block" onclick="vote(\''+x[0]+'\')">Save my vote</button>'+(m.length===3?'<p class="small">Vote saved. You can change it until voting closes.</p>':'')+'</div>';});
 return h;}
function vote(k){var p=[0,1,2].map(function(i){return document.getElementById('v_'+k+i).value;});if(p.some(function(x){return !x;})||new Set(p).size!==3){alert('Pick three different players, one for each place.');return;}call('f.vote',{kind:k,picks:p}).then(function(){return load();}).catch(function(e){alert(e.message);});}
function load(){return call('f.home').then(function(d){D=d;try{s('fam.cache',JSON.stringify({c:CODE,d:d}));}catch(x){}r();splashDone();}).catch(function(e){if(/code/i.test(e.message)){CODE='';s(CK,'');s('fam.cache','');D=null;msg=e.message;}else if(!D){msg=e.message;}r();splashDone();});}
function login(){var v=document.getElementById('code').value.trim();if(!v)return;CODE=v;msg='Checking';document.getElementById('err').textContent='Checking';call('f.home').then(function(d){s(CK,v);D=d;msg='';r();}).catch(function(e){CODE='';msg=e.message;r();});}
function ans(id,a){D.mine[id]=a;r();call('f.answer',{postId:id,answer:a}).catch(function(e){alert(e.message);load();});}
function ask(){var q=document.getElementById('q').value.trim();if(q.length<3)return;askBusy=true;askA='';r();document.getElementById('q').value=q;call('f.ask',{q:q}).then(function(d){askA=d.text;askBusy=false;r();}).catch(function(e){askA=e.message;askBusy=false;r();});}
function out(){CODE='';D=null;s(CK,'');s('fam.cache','');r();}
if(CODE){var cc=null;try{cc=JSON.parse(g('fam.cache')||'null');}catch(x){}if(cc&&cc.c===CODE&&cc.d){D=cc.d;r();splashDone();}load();}else{r();splashDone();}
</script>
