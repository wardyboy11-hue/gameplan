<html lang="en-GB">

<style>
:root{
  --bg:#060A12; --surface:#0C1424; --surface2:#111C32; --ink:#E8F2FF; --muted:#93A8C6; --line:#22375A;
  --accent:#22D3EE; --accent-ink:#021218; --link:#67E8F9; --warn:#FFB84D; --warn-bg:#2A1D08;
  --protect:#0F2A33; --protect-ink:#7DE3F2; --good-bg:#0F2A24; --good:#4ADE80; --glow:rgba(34,211,238,.35);
  --display:"Chakra Petch","Atkinson Hyperlegible Next",Verdana,Arial,sans-serif; --mono:"Share Tech Mono",ui-monospace,Consolas,monospace;
  --body:"Atkinson Hyperlegible Next",Verdana,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;
  padding:0 max(16px,env(safe-area-inset-left,0px)) 80px max(16px,env(safe-area-inset-left,0px))}
a{color:var(--link)}
.wrap{max-width:720px;margin:0 auto}
header{padding-top:max(16px,env(safe-area-inset-top,0px));display:flex;justify-content:space-between;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{height:44px;width:auto;display:block;filter:drop-shadow(0 0 6px rgba(34,211,238,.55))}
h1{margin:0;font-family:var(--display);font-weight:400;font-size:2.4rem;line-height:1}
h2{margin:0 0 8px;font-family:var(--display);font-weight:400;font-size:1.6rem;line-height:1.15}
h3{margin:0;font-size:1rem;font-weight:600}
.muted{color:var(--muted);font-size:.9rem;margin:0}
nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin:8px 0 0;padding:6px 0;display:flex;gap:4px;overflow-x:auto}
.tab{font:inherit;font-weight:600;background:none;border:0;color:var(--muted);padding:8px 14px;border-radius:6px;cursor:pointer;flex:none}
.tab.on{background:var(--accent);color:var(--accent-ink)}
main{padding-top:16px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card.alert{border-color:var(--warn);background:var(--warn-bg)}
.hero{background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:14px 18px;display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.hero .num{font-family:var(--display);font-size:3.8rem;line-height:.9}
.hero .lbl{font-family:var(--display);font-size:1.5rem}
.it{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.it:first-of-type{border-top:0}
.it.done .t{opacity:.55;text-decoration:line-through}
.it input[type=checkbox]{width:24px;height:24px;margin-top:2px;flex:none;accent-color:var(--accent)}
.it .body{min-width:0;flex:1}
.chip{display:inline-block;font-size:.78rem;font-weight:600;padding:1px 9px;border-radius:99px;background:var(--good-bg);white-space:nowrap}
.chip.fam{background:var(--protect);color:var(--protect-ink)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.opt{background:transparent;border:1px dashed var(--protect-ink);color:var(--protect-ink)}
.btn{font:inherit;font-weight:600;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:9px 16px;border-radius:6px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--accent)}
.btn.small{padding:4px 10px;font-size:.85rem}
.btn.quiet{border-color:var(--line);background:transparent;color:var(--muted)}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;align-items:end}
form .full{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;font-weight:600;color:var(--muted);min-width:0}
label.inline{flex-direction:row;align-items:center;gap:8px;color:var(--ink)}
label.inline input{width:22px;height:22px;accent-color:var(--accent)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 10px;width:100%;min-width:0}
textarea{min-height:72px;resize:vertical}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.mode{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:10px;cursor:pointer;color:var(--ink);font-weight:600;background:var(--bg)}
.mode input{width:20px;height:20px;accent-color:var(--accent)}
.mode.on{border-color:var(--accent);background:var(--good-bg)}
.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0}
.day.today{border:2px solid var(--accent)}
.dn{font-family:var(--display);font-size:1.4rem}
.stats{display:flex;gap:22px;flex-wrap:wrap}
.stats .n{font-family:var(--display);font-size:2.4rem;line-height:1}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.login{max-width:420px;margin:10vh auto 0}
.links{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.links a{font-size:.82rem;font-weight:600;color:var(--link);border:1px solid var(--line);border-radius:99px;padding:1px 10px;text-decoration:none;background:var(--bg)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs img{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.sug{border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px;display:grid;gap:8px}
.sug.off{opacity:.5}
.flag{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:10px 12px;font-weight:600}
.ringrow{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.ring{position:relative;width:112px;min-height:112px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.ring .rn{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:.72rem;line-height:1.2;padding:0 14px}
.ring .rn strong{font-family:var(--display);font-size:1.7rem;font-weight:400;line-height:1}
.bars{flex:1 1 180px;min-width:0}
.bar{margin-bottom:10px}.bar .bt{display:flex;justify-content:space-between;font-size:.82rem;margin-bottom:3px}
.bk{height:8px;border-radius:99px;background:var(--line);overflow:hidden}.bf{height:100%;background:var(--link);border-radius:99px}
@media (prefers-reduced-motion:no-preference){.bf{transition:width .5s ease}}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{font-size:.8rem;font-weight:600;padding:2px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.dot.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.scale{display:flex;gap:6px;flex-wrap:wrap}
.scale label{flex-direction:row;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:6px 12px;color:var(--ink);background:var(--bg);cursor:pointer}
.scale input{width:18px;height:18px;accent-color:var(--accent)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.q{font-family:var(--display);font-size:1.5rem;line-height:1.25;margin:6px 0 12px}
.ans{background:var(--good-bg);border-radius:8px;padding:10px 12px;margin:10px 0}
.good{background:var(--good-bg);border-radius:8px;padding:10px 12px}
.sub{font-size:.8rem;color:var(--muted)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mtile{font:inherit;text-align:left;display:flex;flex-direction:column;gap:2px;padding:14px;border-radius:10px;cursor:pointer;color:#F2F8FF;border:1px solid transparent;background:color-mix(in srgb,var(--tint) 62%,#060A12)}
.mtile strong{font-family:var(--display);font-weight:400;font-size:1.35rem}
.mtile span{font-size:.85rem;opacity:.9}
.mtile:hover,.mtile:focus-visible{border-color:var(--accent)}
.msg{border-radius:12px;padding:12px 14px;max-width:92%;min-width:0}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--accent-ink)}
.msg.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line)}
.made{text-align:center;color:var(--muted);font-size:.8rem;margin:24px 0 0}
.reveal{position:relative;display:inline-block;margin-bottom:6px}
.reveal .logo{height:72px}
.reveal .wash{position:absolute;left:0;right:0;bottom:-8px;height:5px;border-radius:3px;background:linear-gradient(90deg,#8A9E7C,#2C5F5F,#C9A227,#6B4F8A,#C17817);clip-path:inset(0 100% 0 0);animation:sweep 2.2s ease-out .3s forwards}
@keyframes sweep{to{clip-path:inset(0 0 0 0)}}
@media (prefers-reduced-motion: reduce){.reveal .wash{animation:none;clip-path:inset(0 0 0 0)}}
.spin{position:relative;width:132px;height:132px;margin:6px auto 10px}.spin svg{position:absolute;inset:0;width:100%;height:100%}.spin .tk{transform-origin:60px 60px;animation:gpspin 3s linear infinite}.spin .mk{position:absolute;left:50%;top:50%;height:58px;width:auto;transform:translate(-50%,-50%);filter:drop-shadow(0 0 6px rgba(34,211,238,.6));animation:gppulse 1.8s ease-in-out infinite}@keyframes gpspin{to{transform:rotate(360deg)}}@keyframes gppulse{50%{opacity:.7}}@media (prefers-reduced-motion: reduce){.spin .tk,.spin .mk{animation:none}}
:focus-visible{outline:3px solid var(--link);outline-offset:2px}

/* ===== HUD skin: sci fi, game feel. Dark only. Cipher logo kept. ===== */
body{background-color:var(--bg);
  background-image:radial-gradient(900px 420px at 80% -120px,rgba(34,211,238,.10),transparent 70%),
    linear-gradient(rgba(103,232,249,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(103,232,249,.035) 1px,transparent 1px);
  background-size:auto,44px 44px,44px 44px;background-attachment:fixed}
h1,h2,.q,.dn,.hero .lbl{font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
h1{font-size:1.7rem;line-height:1.05;text-shadow:0 0 18px var(--glow)}
h2{font-size:1.15rem;color:var(--ink);padding-left:10px;border-left:3px solid var(--accent)}
.q{font-size:1.15rem;line-height:1.35;text-transform:none;letter-spacing:.01em}
.dn{font-size:1.05rem}
h3{font-family:var(--display);letter-spacing:.03em}
.hero .num,.stats .n,.ring .rn strong,.sub b{font-family:var(--mono);font-weight:400}
.ring .rn strong{font-size:1.6rem;color:var(--ink);text-shadow:0 0 12px var(--glow)}
nav{background:rgba(6,10,18,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.tab{font-family:var(--display);font-size:.78rem;text-transform:uppercase;letter-spacing:.09em;border-radius:0;border-bottom:2px solid transparent;padding:8px 12px}
.tab.on{background:linear-gradient(180deg,transparent,rgba(34,211,238,.16));color:var(--link);border-bottom-color:var(--accent);box-shadow:0 8px 18px -10px var(--glow)}
.card,.day,.sug{border-radius:2px;border-color:var(--line);
  background:linear-gradient(135deg,rgba(34,211,238,.07),transparent 38%),var(--surface);
  clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px));
  box-shadow:inset 0 1px 0 rgba(103,232,249,.10)}
.card{position:relative}
.card.alert{background:var(--warn-bg)}
.day.today{border:1px solid var(--accent);box-shadow:inset 0 0 0 1px var(--accent),0 0 22px -8px var(--glow)}
.hero{border-radius:2px;background:linear-gradient(100deg,var(--accent),#7DD3FC 70%,#A5B4FC);box-shadow:0 0 28px -8px var(--glow);
  clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,0 100%)}
.hero .num{font-size:3.2rem}
.btn{font-family:var(--display);text-transform:uppercase;letter-spacing:.07em;font-weight:700;font-size:.85rem;border-radius:2px;
  box-shadow:0 0 16px -4px var(--glow);clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px))}
.btn.ghost{color:var(--link);background:rgba(34,211,238,.06);box-shadow:none}
.btn.quiet{box-shadow:none;color:var(--muted)}
.btn.small{font-size:.74rem;padding:5px 10px}
.btn:hover:not(:disabled){filter:brightness(1.12)}
input,select,textarea{border-radius:2px;background:#050911;border-color:#4F78B0}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 1px var(--accent),0 0 14px -4px var(--glow)}
.chip,.dot{border-radius:2px;font-family:var(--mono);font-weight:400;font-size:.76rem;letter-spacing:.04em;text-transform:uppercase}
.chip{background:rgba(34,211,238,.10);color:var(--link);border:1px solid rgba(34,211,238,.28)}
.chip.fam{background:var(--protect);color:var(--protect-ink)}
.chip.warn{background:var(--warn-bg);color:var(--warn);border-color:rgba(255,184,77,.4)}
.dot.on{box-shadow:0 0 12px -2px var(--glow)}
.links a{border-radius:2px;font-family:var(--mono);font-weight:400;background:#050911}
.mode,.scale label,.mtile,.thumbs img,.ans,.good,.flag,.msg{border-radius:2px}
.mode.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.msg.u{background:linear-gradient(100deg,var(--accent),#7DD3FC)}
.msg.a{border-color:var(--line);background:var(--surface2)}
.ans,.good{border-left:3px solid var(--good)}
.it{border-top:1px solid rgba(34,55,90,.7)}
#toast{background:var(--surface2);color:var(--ink);border:1px solid var(--accent);border-radius:2px;box-shadow:0 0 22px -6px var(--glow);font-family:var(--display);letter-spacing:.03em}
/* ring: tick bezel, glow, flat ends */
.ring svg{filter:drop-shadow(0 0 6px rgba(34,211,238,.55))}
.ring svg circle{stroke-linecap:butt}
.ring::before{content:"";position:absolute;inset:-5px;border-radius:50%;pointer-events:none;
  background:repeating-conic-gradient(rgba(103,232,249,.35) 0 1.4deg,transparent 1.4deg 7.5deg);
  -webkit-mask:radial-gradient(circle,transparent 62%,#000 63%,#000 100%);mask:radial-gradient(circle,transparent 62%,#000 63%,#000 100%)}
.ring{margin:6px}
/* segmented bars */
.bk{height:10px;border-radius:0;background:repeating-linear-gradient(90deg,#14223C 0 9px,transparent 9px 12px)}
.bf{border-radius:0;background:repeating-linear-gradient(90deg,var(--link) 0 9px,transparent 9px 12px);box-shadow:0 0 12px -2px var(--glow)}
.bar>span{background:var(--accent);box-shadow:0 0 12px -2px var(--glow)}
.bt span:last-child{font-family:var(--mono);color:var(--link);white-space:nowrap;font-size:.74rem;letter-spacing:.02em;text-transform:uppercase}
.bars .bt span:first-child{white-space:nowrap}
.login{border:1px solid var(--line);padding:20px 18px;background:var(--surface);clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px))}
.made{font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase}
/* fixes: progress bars wrapper was inheriting the old 10px bar track */
.bars .bar{height:auto;background:none;border-radius:0;overflow:visible}
.bars .bt{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;font-family:var(--display);color:var(--muted)}
.ring:has(.rn[style*="static"])::before{display:none}
.ring .rn[style*="static"] strong{font-family:var(--display);font-size:1rem;text-transform:uppercase;letter-spacing:.05em;text-shadow:none}
.mtile{background:linear-gradient(135deg,color-mix(in srgb,var(--tint) 45%,#060A12),#09111f 85%);border:1px solid var(--line);border-left:4px solid color-mix(in srgb,var(--tint) 55%,#9FE8FF)}
.mtile strong{font-family:var(--display);text-transform:uppercase;letter-spacing:.04em;font-size:1.05rem;font-weight:600}
.mtile:hover,.mtile:focus-visible{box-shadow:0 0 0 1px var(--accent),0 0 18px -6px var(--glow)}
/* soft scan sweep on the hero, off for reduced motion */
@media (prefers-reduced-motion:no-preference){
  .hero{position:relative;overflow:hidden}
  .hero::after{content:"";position:absolute;top:0;bottom:0;width:60px;left:-80px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent);animation:scan 5s ease-in-out infinite}
  @keyframes scan{0%,60%{left:-80px}100%{left:110%}}
}

/* ===== v2 layout: bottom navigation, bigger tap targets, calmer Today ===== */
body{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
nav.sub{top:0;padding:6px 0;gap:6px;overflow-x:auto;scrollbar-width:none}
nav.sub::-webkit-scrollbar{display:none}
nav.sub .tab{min-height:44px;font-size:.82rem;padding:8px 16px;white-space:nowrap}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(6,10,18,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bnav button{font:inherit;background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:60px;padding:6px 2px;cursor:pointer;font-family:var(--display);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;border-top:2px solid transparent}
.bnav button.on{color:var(--link);border-top-color:var(--accent);background:linear-gradient(180deg,rgba(34,211,238,.16),transparent)}
.bnav button:focus-visible{outline:3px solid var(--link);outline-offset:-3px}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:31;width:56px;height:56px;border-radius:50%;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font:inherit;font-size:2rem;line-height:1;font-weight:400;cursor:pointer;box-shadow:0 0 22px -2px var(--glow),0 6px 14px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:0 0 3px}
.fab:active{transform:scale(.95)}
#toast{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
.btn.small{min-height:44px;min-width:44px;font-size:.78rem;padding:8px 14px}
.it input[type=checkbox]{width:30px;height:30px}
.it{padding:12px 0}
.ring{width:104px;min-height:104px}
.ring .rn{font-size:.64rem;padding:0 20px}
.ring .rn strong{font-size:1.4rem}
.ringrow{gap:14px;flex-wrap:nowrap}
.bars{flex:1 1 0;min-width:0}
.bars .bt{flex-wrap:wrap;gap:2px 8px}
.bars .bt span:first-child,.bt span:last-child{white-space:normal}
.bt span:last-child{font-size:.7rem}
.sub{font-size:.82rem}
@media (max-width:400px){.chip{font-size:.72rem}}
@media (prefers-reduced-motion:reduce){.fab:active{transform:none}}
</style>
</head>

function parseReply(s,res,rej){var r;try{r=JSON.parse(s);}catch(e){return rej(new Error('Unexpected reply'));}if(r.ok)res(r.data);else rej(new Error(r.error));}
function call(action,p){
  return new Promise(function(res,rej){
    if(window.google&&google.script&&google.script.run){
      google.script.run.withSuccessHandler(function(s){parseReply(s,res,rej);})
        .withFailureHandler(function(e){rej(new Error((e&&e.message)||'No connection. Try again.'));}).api(CODE,action,p||{});
      return;
    }
    fetch(API_URL,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({code:CODE,action:action,payload:p||{}})})
      .then(function(r){return r.text();}).then(function(t){parseReply(t,res,rej);})
      .catch(function(){rej(new Error('No connection. Try again.'));});
  });
}

}

      '<p class="sub" style="margin-top:10px">Main work</p>'+g.main.map(function(m){return '<div class="it"><div class="body"><strong>'+esc(m.name)+'</strong> <span class="chip">'+esc(m.sets)+' x '+esc(m.reps)+'</span>'+(m.tip?'<p class="muted">Trainer: '+esc(m.tip)+'</p>':'')+(m.football?'<p class="muted">Strength coach: '+esc(m.football)+'</p>':'')+'</div></div>';}).join('')+
      '<p class="sub" style="margin-top:10px">Cool down</p><ul style="margin:0 0 0 18px;padding:0">'+g.cooldown.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>'+
      '<p class="sub" style="margin-top:10px">EQ coach: afterwards</p><p>'+esc(g.comingOut)+'</p><p class="muted" style="margin-top:10px">'+esc(g.safety)+'</p></div>';
  }
  return h;
}

function render(){

  if(!ST){r.innerHTML=loading?'<div class="login card" style="text-align:center"><div class="spin"><svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="43" fill="none" stroke="#22D3EE" stroke-opacity=".45" stroke-width="1.2"/><circle class="tk" cx="60" cy="60" r="55" fill="none" stroke="#22D3EE" stroke-width="5" stroke-dasharray="2 3.45"/></svg><img class="mk" src="https://game.cipher-training.co.uk/mark.png" alt=""></div><p class="muted" role="status">Opening your plan</p></div>':vLogin();return;}
  var V={today:vToday,ask:vAsk,cards:vCards,week:vWeek,add:vAdd,scan:vScan,gym:vGym,explore:vExplore,me:vMe,future:vFuture,help:vHelp,print:vPrint,more:vMore};
  r.innerHTML='<header><div class="brand"><img class="logo" src="'+LOGO+'" alt="Cipher"><h1>Game Plan</h1></div><span class="chip'+(isRohan()?'':' fam')+'">'+(isRohan()?'Rohan':'Mum and dad')+'</span></header>'+
    (function(){var g=grpOf(tab);LASTV[g[0]]=tab;var vs=g[2].filter(function(x){return x!=='print';});
      return vs.length>1?'<nav class="sub" aria-label="'+g[1]+'">'+vs.map(function(v){return '<button class="tab'+(v===tab?' on':'')+'" data-act="tab" data-v="'+v+'"'+(v===tab?' aria-current="page"':'')+'>'+SUBNAME[v]+'</button>';}).join('')+'</nav>':'';})()+
    '<main>'+V[tab]()+'</main><p class="made">made by Cipher</p>'+
    (tab!=='add'?'<button class="fab" data-act="tab" data-v="add" aria-label="Add something">+</button>':'')+
    '<div class="bnav" role="navigation" aria-label="Main">'+GROUPS.map(function(g){var on=grpOf(tab)[0]===g[0];var go=on?g[2][0]:(LASTV[g[0]]||g[2][0]);return '<button data-act="tab" data-v="'+go+'"'+(on?' class="on" aria-current="page"':'')+'><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="'+g[3]+'"/></svg><span>'+g[1]+'</span></button>';}).join('')+'</div>';
}


function resize(file){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){var m=1400,w=img.width,h=img.height,k=Math.min(1,m/Math.max(w,h));var c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',0.72).split(',')[1]);};
    img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('Could not open that photo'));};
    img.src=url;
  });
}
function takeFiles(files){
  var list=Array.prototype.slice.call(files||[]).slice(0,3-scanImgs.length);
  if(!list.length){toast('Three photos at most');return;}
  var ta=document.getElementById('scan_text');if(ta)scanText=ta.value;
  Promise.all(list.map(resize)).then(function(arr){scanImgs=scanImgs.concat(arr).slice(0,3);render();}).catch(function(e){toast(e.message);});
}
function addScan(){
  var chosen=scanOut.items.filter(function(i){return !i.off;});
  if(!chosen.length){toast('Tick at least one');return;}
  var chain=Promise.resolve();
  chosen.forEach(function(i){chain=chain.then(function(){return call('addItem',{title:i.title,type:i.type,date:i.date,time:i.time,mins:i.mins,subject:i.subject,notes:i.advice,links:i.resourceIds});});});
  chain.then(function(){toast('Added to your planner');scanOut=null;scanImgs=[];scanText='';tab='today';return boot(true);}).catch(function(x){toast(x.message);boot(true);});
}
/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.dataset.act,id=b.dataset.id;
  if(a==='tick')return;
  if(a==='tab'){tab=b.dataset.v;editId=null;render();window.scrollTo(0,0);}
  else if(a==='wk'){var dd=Number(b.dataset.d);weekOff=dd===0?0:weekOff+dd;render();}
  else if(a==='addfor'){addPre=b.dataset.d;tab='add';render();window.scrollTo(0,0);}
  else if(a==='edit'){editId=id;render();}
  else if(a==='canceledit'){editId=null;render();}
  else if(a==='remove'){editId=null;act('removeItem',{id:id},'Deleted');}
  else if(a==='stoprepeat'){editId=null;act('stopRepeat',{tpl:b.dataset.tpl},'Stopped repeating');}
  else if(a==='mv'){act('editItem',{id:id,date:b.dataset.to},'Moved');}
  else if(a==='mvpick'){var v=document.getElementById('pick_'+id).value;if(!v){toast('Pick a day first');return;}act('editItem',{id:id,date:v},'Moved');}
  else if(a==='drop'){act('setStatus',{id:id,status:'dropped'},'Dropped');}
  else if(a==='skiprefl'){reflId=null;render();}
  else if(a==='deldate'){act('removeDate',{id:id},'Removed');}
  else if(a==='sendsummary'){act('sendSummary',{},'Summary sent');}
  else if(a==='savecheck'){lsSet('gp.check',JSON.stringify(readCheck()));toast('Saved on this phone');}
  else if(a==='sendcheck'){var c=readCheck();lsSet('gp.check',JSON.stringify(c));
    var txt='What worked: '+c.well+'\nWhat I want to change: '+c.change+'\nComing up: '+c.coming;
    act('shareCheck',{text:txt},'Sent');}
  else if(a==='helpfor'){e.preventDefault();helpSub=b.dataset.sub;tab='help';render();window.scrollTo(0,0);}
  else if(a==='hsub'){helpSub=b.dataset.v;render();}
  else if(a==='clearscan'){e.preventDefault();scanImgs=[];scanOut=null;render();}
  else if(a==='readit'){var ta=document.getElementById('scan_text');scanText=ta?ta.value:scanText;scanBusy=true;scanOut=null;render();
    call('scan',{images:scanImgs,text:scanText}).then(function(d){scanBusy=false;scanOut=d;ST.scansLeft=d.scansLeft;render();}).catch(function(x){scanBusy=false;render();toast(x.message);});}
  else if(a==='addscan'){addScan();}
  else if(a==='smode'){var ta0=document.getElementById('scan_text');if(ta0)scanText=ta0.value;scanMode=b.dataset.v;render();}
  else if(a==='psub'){printSub=b.dataset.v;printGroups={};printUrl='';render();}
  else if(a==='pmake'||a==='pmail'){var picks=printPicks();if(!picks.length){toast('Tick at least one group');return;}printBusy=true;printUrl='';render();
    call('printList',{subject:printSub,groups:picks,email:a==='pmail'}).then(function(d){printBusy=false;if(d.emailed)toast('Sent to mum and dad');else{printName=d.name;printUrl=b64Url(d.b64);toast('Ready');}render();}).catch(function(x){printBusy=false;render();toast(x.message);});}
  else if(a==='exsub'){exSub=b.dataset.v;render();}
  else if(a==='planvisit'){addTitle='Visit: '+b.dataset.t;addType='other';addPre=addDays(ST.today,7);tab='add';render();window.scrollTo(0,0);}
  else if(a==='makequiz'){
    var ta1=document.getElementById('scan_text'),sb=document.getElementById('quiz_subj');scanText=ta1?ta1.value:scanText;if(sb)quizSubj=sb.value;quizBusy=true;render();
    call('quiz',{subject:quizSubj,images:scanImgs,text:scanText}).then(function(d){quizBusy=false;quizOut=d;ST.quizzesLeft=d.quizzesLeft;qPhase='predict';qi=0;qMarks=[];qShow=false;scanImgs=[];scanText='';render();}).catch(function(x){quizBusy=false;render();toast(x.message);});}
  else if(a==='qstart'){qPred=Number(document.getElementById('q_pred').value);qPhase='ask';qi=0;qMarks=[];qShow=false;render();}
  else if(a==='qshow'){qShow=true;render();}
  else if(a==='qmark'){qMarks.push(Number(b.dataset.v));qShow=false;qi++;
    if(qi>=quizOut.questions.length){qPhase='done';var got=qMarks.reduce(function(x,y){return x+y;},0);
      call('addPractice',{subject:quizOut.subject,topic:quizOut.topic,predicted:qPred,got:got,outof:quizOut.questions.length}).then(function(){return boot(true);}).catch(function(x){toast(x.message);});}
    render();}
  else if(a==='qfix'){var ms=qMarks.filter(function(m){return m===0;}).length;
    call('addItem',{title:'Fix up: '+quizOut.topic,type:'study',subject:quizOut.subject,date:addDays(ST.today,1),time:'17:00',mins:'15',notes:'Redo the '+ms+' I missed. Open my notes first, then answer without them.'}).then(function(){toast('Added for tomorrow');return boot(true);}).catch(function(x){toast(x.message);});}
  else if(a==='qagain'){quizOut=null;qPhase='';qMarks=[];render();}
  else if(a==='savevoice'){lsSet('gp.voice',JSON.stringify(readVoice()));toast('Saved on this phone');}
  else if(a==='sendvoice'){var vv=readVoice();lsSet('gp.voice',JSON.stringify(vv));
    act('shareNote',{label:'what I want from sixth form',text:'What I would want: '+vv.want+'\nWhat I would miss: '+vv.miss+'\nWhat I am curious about: '+vv.curious+'\nQuestions I want to ask: '+vv.ask},'Sent');}
  else if(a==='youlater'){youLater=true;render();}
  else if(a==='youedit'){youEdit=true;tab='today';render();window.scrollTo(0,0);}
  else if(a==='moodpick'){moodDraft={quad:b.dataset.v};moodStep=1;render();}
  else if(a==='moodword'){moodDraft.word=b.dataset.v;render();}
  else if(a==='moodreason'){moodDraft.reason=b.dataset.v;render();}
  else if(a==='moodnext'){var mw=document.getElementById('mood_word');if(mw&&mw.value.trim())moodDraft.word=mw.value.trim();moodStep=2;render();}
  else if(a==='moodnext2'){var mo=document.getElementById('mood_own');moodDraft.own=mo?mo.value.trim():'';moodStep=3;render();}
  else if(a==='moodskip'){moodDraft.own='';moodStep=3;render();}
  else if(a==='mooduse'){moodDraft.use=b.value;}
  else if(a==='moodsave'){var sh=document.getElementById('mood_share');
    call('addMood',{quad:moodDraft.quad,word:moodDraft.word||'',reason:moodDraft.reason||'',own:moodDraft.own||'',use:moodDraft.use||'',shared:!!(sh&&sh.checked)}).then(function(d){moodPlan=d.plan;moodSupport=d.support;moodStep=0;moodDraft={};moodRedo=false;return boot(true);}).catch(function(x){toast(x.message);});}
  else if(a==='moodclose'){moodPlan=null;moodSupport=false;moodStep=0;moodDraft={};moodRedo=false;render();}
  else if(a==='moodredo'){e.preventDefault();moodRedo=true;moodStep=0;render();}
  else if(a==='asksub'){askSubj=b.dataset.v;render();}
  else if(a==='askstart'){askDraft=b.dataset.v;render();var ai=document.getElementById('ask_in');if(ai)ai.focus();}
  else if(a==='askclear'){askMsgs=[];render();}
  else if(a==='askread'){speak(askMsgs[Number(b.dataset.n)].text);}
  else if(a==='asksug'){var sm=askMsgs[Number(b.dataset.n)].suggest;
    call('addItem',{title:sm.title,type:'study',subject:sm.subject,date:addDays(ST.today,1),time:'17:00',mins:sm.mins}).then(function(){toast('Added for tomorrow');return boot(true);}).catch(function(x){toast(x.message);});}
  else if(a==='askgo'){var ta2=document.getElementById('ask_in'),q=ta2?ta2.value.trim():'';if(!q){toast('Type your question first');return;}
    var hist=askMsgs.slice(-6).map(function(m){return {role:m.role,text:m.text};});
    askMsgs.push({role:'user',text:q});askDraft='';askBusy=true;render();
    call('ask',{q:q,subject:askSubj,history:hist,profile:youText()}).then(function(d){askBusy=false;askMsgs.push({role:'assistant',text:d.answer,nextStep:d.nextStep,askBack:d.askBack,flag:d.flag,links:d.links,suggest:d.suggest,record:d.record});if(ST.ask)ST.ask.asksLeft=d.asksLeft;render();var last=document.querySelector('.msg.a:last-of-type');if(last)last.scrollIntoView({block:'nearest'});}).catch(function(x){askBusy=false;askMsgs.pop();askDraft=q;render();toast(x.message);});}
  else if(a==='cseg'){cardSeg=b.dataset.v;render();}
  else if(a==='cstart'){cardPred=Number(document.getElementById('c_pred').value);cardQ=cardOut.cards.map(function(c){return {q:c.q,a:c.a,hint:c.hint,tag:c.tag};});cardI=0;cardFlip=false;cardMarks=[];cardPhase='run';render();}
  else if(a==='cflip'){cardFlip=true;render();}
  else if(a==='cread'){speak(b.dataset.w==='q'?cardQ[cardI].q:cardQ[cardI].a);}
  else if(a==='cmark'){var cv=Number(b.dataset.v),cc=cardQ[cardI];
    if(!cc.again)cardMarks.push(cv);
    if(cv===0&&!cc.again)cardQ.push({q:cc.q,a:cc.a,hint:cc.hint,tag:cc.tag,again:true});
    cardI++;cardFlip=false;
    if(cardI>=cardQ.length){cardPhase='done';var cg=cardMarks.reduce(function(x,y){return x+y;},0),ct=cardOut.cards.length;
      call('addPractice',{subject:cardOut.subject,topic:cardOut.topic,predicted:Math.min(cardPred,ct),got:cg,outof:ct}).then(function(){return call('addCovered',{subject:cardOut.subject,topic:cardOut.topic,status:cg/ct>=0.7?'practised':'shaky'});}).then(function(){return boot(true);}).catch(function(x){toast(x.message);});}
    render();}
  else if(a==='cagain'){cardOut=null;cardPhase='';cardQ=[];render();}
  else if(a==='signout'){lsSet('gp.code','');CODE='';ST=null;err='';render();}
});
function readVoice(){var f=document.querySelector('[data-form="voice"]');return {want:f.want.value,miss:f.miss.value,curious:f.curious.value,ask:f.ask.value};}
function readCheck(){var f=document.querySelector('[data-form="check"]');return {well:f.well.value,change:f.change.value,coming:f.coming.value};}
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.matches('[data-act="tick"]')){
    var done=t.checked;reflId=done?t.dataset.id:null;
    call('setStatus',{id:t.dataset.id,status:done?'done':'todo'}).then(function(){return boot(true);}).then(function(){if(reflId){var i=document.getElementById('refl_input');if(i)i.focus();}}).catch(function(x){toast(x.message);boot(true);});
  }else if(t.matches('[data-act="pathtick"]')){act('setPath',{id:t.dataset.id,done:t.checked},t.checked?'Ticked':'Unticked');}
  else if(t.id==='scan_cam'||t.id==='scan_gal'){takeFiles(t.files);t.value='';}
  else if(t.matches('[data-act="pgroup"]')){printGroups[Number(t.dataset.n)]=t.checked;printUrl='';}
  else if(t.matches('[data-act="sugon"]')){scanOut.items[Number(t.dataset.n)].off=!t.checked;render();}
  else if(t.dataset&&t.dataset.sug){scanOut.items[Number(t.dataset.n)][t.dataset.sug]=t.value;}
  else if(t.id==='as_date'){asDate=t.value;render();}
  else if(t.id==='add_type'){addType=t.value;var w=document.getElementById('rep_wrap');if(w)w.style.display=addType==='study'?'':'none';}
  else if(t.name==='mode'){document.querySelectorAll('.mode').forEach(function(m){m.classList.toggle('on',m.querySelector('input').checked);});}
});
document.addEventListener('submit',function(e){
  var f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();
  var d=Object.fromEntries(new FormData(f).entries()),k=f.dataset.form;
  if(k==='login'){CODE=d.code.trim();lsSet('gp.code',CODE);boot();}
  else if(k==='daily'){act('setDaily',{date:d.date,mode:d.mode,details:d.details},isRohan()?'Saved. Mum and dad have been told.':'Saved');}
  else if(k==='add'){d.remind=!!d.remind;d.repeat=!!d.repeat;addPre='';addTitle='';addType='study';tab='today';call('addItem',d).then(function(){toast('Added');return boot(true);}).catch(function(x){toast(x.message);});}
  else if(k==='edit'){editId=null;act('editItem',{id:d.id,title:d.title,date:d.date,time:d.time,mins:d.mins,notes:d.notes},'Saved');}
  else if(k==='refl'){reflId=null;act('setStatus',{id:d.id,status:'done',reflection:d.reflection},'Saved');}
  else if(k==='adddate'){act('addDate',d,'Added');}
  else if(k==='test'){act('addTest',d,'Saved');}
  else if(k==='checkin'){d.shared=!!d.shared;act('addCheckin',d,d.shared?'Saved and shared':'Saved. Only you see it.');}
  else if(k==='visit'){act('addVisit',d,'Saved');}
  else if(k==='you'){var y={interests:d.interests||'',music:d.music||'',shows:d.shows||'',careers:d.careers||'',speak:SPEAK.filter(function(sp){return d['speak_'+sp.replace(/ /g,'_')];})};lsSet('gp.me',JSON.stringify(y));YOU=y;youEdit=false;toast('Saved on this phone');render();}
  else if(k==='covered'){act('addCovered',d,'Saved');}
  else if(k==='cardmake'){cardSubj=d.subject;cardBusy=true;render();call('cards',{subject:d.subject,topic:d.topic,n:d.n}).then(function(o){cardBusy=false;cardOut=o;cardPhase='predict';if(ST.ask)ST.ask.cardsLeft=o.cardsLeft;render();}).catch(function(x){cardBusy=false;render();toast(x.message);});}
  else if(k==='gymmake'){gymBusy=true;render();call('gym',d).then(function(o){gymBusy=false;gymOut=o;if(ST.ask)ST.ask.gymLeft=o.gymLeft;render();}).catch(function(x){gymBusy=false;render();toast(x.message);});}
  else if(k==='pathadd'){act('addPath',d,'Added');}
});
document.addEventListener('input',function(e){if(e.target&&e.target.id==='ask_in')askDraft=e.target.value;});
CODE=lsGet('gp.code');
if(CODE)boot();else render();
})();
