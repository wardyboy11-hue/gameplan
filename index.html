<!doctype html>
<html lang="en-GB" style="background:#000">
<head>
<meta charset="utf-8">
<title>Game Plan</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060A12">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Game Plan">
<style>
html,body{margin:0;height:100%;background:#000}
iframe{border:0;width:100%;height:100%;display:block;opacity:0;transition:opacity .35s ease;position:relative;z-index:2}
iframe.on{opacity:1}
#wr{position:fixed;inset:0;width:100%;height:100%;z-index:1;background:#000}
#ib{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:9;display:none;align-items:center;gap:12px;background:#0C1424;border:1px solid #22D3EE;border-radius:14px;padding:12px 14px;color:#E8F2FF;font:15px/1.35 Verdana,Arial,sans-serif;box-shadow:0 0 18px rgba(34,211,238,.35);max-width:520px;margin:0 auto}
#ib.on{display:flex}#ib img{width:44px;height:44px;border-radius:10px;flex:none}#ib .t{flex:1;min-width:0}#ib b{display:block;font-size:16px}
#ib button{font:inherit;font-weight:700;border-radius:8px;padding:8px 14px;cursor:pointer;flex:none}#ibGo{background:#22D3EE;color:#021218;border:0}#ibX{background:none;color:#93A8C6;border:0;font-size:20px!important;padding:4px 6px!important}
#off{display:none;font-family:Verdana,Arial,sans-serif;color:#060A12;padding:24px}
</style>
</head>
<body>
<!-- Replace the address below with your Apps Script web app URL (ends in /exec) -->
<canvas id="wr" aria-hidden="true"></canvas>
<iframe id="app" title="Game Plan" src="https://script.google.com/macros/s/AKfycbzP1PB48zdAabVhK8EHmaODCs5SYS44pOSlzQJ9-mtugQ3cyjgCJnOUnGXmAauiScDD/exec" allow="clipboard-write; camera; microphone"></iframe>
<div id="ib" role="dialog" aria-label="Install Game Plan"><img src="icon-192.png" alt=""><div class="t"><b>Install Game Plan</b><span id="ibTx">Add it to your home screen so it opens like an app.</span></div><button id="ibGo" type="button">Install</button><button id="ibX" type="button" aria-label="Not now">&times;</button></div>
<div id="off">No signal. Game Plan needs the internet. Try again when you are back online.</div>
<script>
/* tiny rain while the app loads, then hand over to the app when it says it is ready */
(function(){
var cv=document.getElementById('wr'),f=document.getElementById('app'),ctx=cv.getContext('2d'),fs=16,cols=[],W,H,raf,last=0,done=false;
var G='ｦｱｳｴｵｶｷｹｺｻｼｽｾｿﾀﾂﾃﾅﾆﾇﾈﾊﾋﾎﾏﾐﾑﾒﾓﾔﾕﾗﾘﾜ0123456789Z:.=*+<>';
var calm=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function size(){var d=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);cols=[];for(var i=0;i<Math.ceil(W/fs);i++)cols.push(Math.random()*-H/fs);}
function draw(t){raf=requestAnimationFrame(draw);if(document.hidden||t-last<32)return;last=t;ctx.fillStyle='rgba(0,0,0,.09)';ctx.fillRect(0,0,W,H);ctx.font=fs+'px monospace';
 for(var i=0;i<cols.length;i++){var y=cols[i]*fs;ctx.fillStyle='#0a8a3a';ctx.fillText(G[(Math.random()*G.length)|0],i*fs,y-fs);ctx.fillStyle='#eafff1';ctx.fillText(G[(Math.random()*G.length)|0],i*fs,y);cols[i]+=.5+(i%5)*.15;if(y>H&&Math.random()>.97)cols[i]=0;}}
function reveal(){if(done)return;done=true;f.classList.add('on');setTimeout(function(){cancelAnimationFrame(raf);cv.style.display='none';},400);}
size();addEventListener('resize',size);if(!calm)raf=requestAnimationFrame(draw);
addEventListener('message',function(e){if(e.data&&e.data.gp==='ready')reveal();});
setTimeout(reveal,8000);
})();
/* pass ?drop=1, ?reset=... etc. through to the app */
(function(){var q=location.search;if(q&&q.length>1){var f=document.getElementById('app');f.src=f.src.split('?')[0]+q;}})();
/* install offer: Android/Chrome/Edge use the real prompt, iPhone/iPad get Share > Add to Home Screen steps */
(function(){
var b=document.getElementById('ib'),go=document.getElementById('ibGo'),x=document.getElementById('ibX'),tx=document.getElementById('ibTx'),ev=null;
var inst=(matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches||navigator.standalone===true);
if(inst)return;
try{var t=+localStorage.getItem('gpInstallNo')||0;if(Date.now()-t<3*864e5)return;}catch(e){}
function show(){b.classList.add('on');}
function hide(){b.classList.remove('on');}
x.onclick=function(){hide();try{localStorage.setItem('gpInstallNo',Date.now());}catch(e){}};
var ua=navigator.userAgent,ios=/iPad|iPhone|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
addEventListener('beforeinstallprompt',function(e){e.preventDefault();ev=e;go.style.display='';tx.textContent='Add it to your home screen so it opens like an app.';show();});
go.onclick=function(){if(!ev)return;ev.prompt();ev.userChoice.then(function(){ev=null;hide();});};
addEventListener('appinstalled',hide);
if(ios){go.style.display='none';tx.innerHTML=/CriOS|FxiOS|EdgiOS/.test(ua)?'Tap <b style="display:inline">Share</b> (the square with an arrow), then <b style="display:inline">Add to Home Screen</b>.':'Tap <b style="display:inline">Share</b> &#x2B06;&#xFE0E; below, then <b style="display:inline">Add to Home Screen</b>.';setTimeout(show,1500);}
else setTimeout(function(){if(!ev&&!b.classList.contains('on')){go.style.display='none';tx.textContent='Use your browser menu and choose Install app or Add to Home screen.';show();}},6000);
})();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){});}
window.addEventListener('offline',function(){document.getElementById('app').style.display='none';document.getElementById('off').style.display='block';});
window.addEventListener('online',function(){location.reload();});
</script>
</body>
</html>
